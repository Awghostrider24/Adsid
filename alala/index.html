<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Input Produk — Alala Jusss</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.wrap{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 6px 24px rgba(0,0,0,.08);
}

h1{
    margin:0 0 5px;
    font-size:24px;
}

.sub{
    color:#666;
    margin:0 0 20px;
    line-height:1.5;
}

label{
    display:block;
    font-weight:700;
    margin:14px 0 7px;
}

small{
    font-weight:normal;
    color:#777;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
    background:#fff;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:#888;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.filebox{
    border:2px dashed #ccc;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.filebox input[type=file]{
    padding:8px;
    border:0;
}

.preview{
    width:100%;
    max-height:240px;
    object-fit:contain;
    border-radius:10px;
    margin-top:12px;
    display:none;
    background:#f4f4f4;
}

.image-info,
.compress-info{
    margin-top:8px;
    font-size:13px;
    color:#666;
    line-height:1.5;
}

.image-info{
    display:none;
}

.compress-info{
    display:none;
    text-align:center;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#111;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

button:hover:not(:disabled){
    background:#333;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.msg{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
    line-height:1.5;
}

.ok{
    display:block;
    background:#e8f7ed;
    color:#176b35;
}

.err{
    display:block;
    background:#fdecec;
    color:#a12626;
}

.progress{
    margin-top:12px;
    height:8px;
    background:#eee;
    border-radius:8px;
    overflow:hidden;
    display:none;
}

.bar{
    height:100%;
    width:0%;
    background:#333;
    transition:width .25s ease;
}

.loading{
    display:none;
    margin-top:10px;
    text-align:center;
    color:#666;
    font-size:13px;
}

@media(max-width:420px){

    .wrap{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

}
</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1>Tambah Produk</h1>

<p class="sub">
Foto dari HP akan otomatis diperkecil dan dikompres sebelum dikirim ke Google Drive.
</p>

<form id="productForm">

<!-- ID PRODUK -->

<label>
ID Produk <small>(otomatis)</small>
</label>

<input
    id="id"
    name="id"
    readonly
    placeholder="Akan dibuat otomatis"
>


<!-- NAMA PRODUK -->

<label>
Nama Produk
</label>

<input
    id="name"
    name="name"
    required
    autocomplete="off"
    placeholder="Contoh: Jus Alpukat"
>


<!-- DESKRIPSI -->

<label>
Deskripsi
</label>

<textarea
    id="desc"
    name="desc"
    required
    placeholder="Deskripsi singkat produk"
></textarea>


<!-- HARGA -->

<div class="row">

<div>

<label>
Harga Small
</label>

<input
    id="small"
    name="small"
    type="number"
    min="0"
    required
    placeholder="10000"
>

</div>


<div>

<label>
Harga Medium
</label>

<input
    id="medium"
    name="medium"
    type="number"
    min="0"
    required
    placeholder="14000"
>

</div>

</div>


<!-- FOTO -->

<label>
Foto Produk
</label>

<div class="filebox">

<input
    id="image"
    name="image"
    type="file"
    accept="image/jpeg,image/png,image/webp,image/*"
    capture="environment"
    required
>

<img
    id="preview"
    class="preview"
    alt="Preview foto produk"
>

<div
    id="imageInfo"
    class="image-info">
</div>

</div>


<div
    id="compressInfo"
    class="compress-info">
</div>


<!-- STATUS -->

<label>
Status
</label>

<select
    id="status"
    name="status"
>

<option value="tersedia">
Tersedia
</option>

<option value="habis">
Habis
</option>

</select>


<!-- PROGRESS -->

<div
    id="progress"
    class="progress"
>

<div
    id="bar"
    class="bar">
</div>

</div>


<div
    id="loading"
    class="loading">
Sedang mengirim produk...
</div>


<!-- BUTTON -->

<button
    id="submitBtn"
    type="submit"
>
Simpan Produk
</button>


<!-- MESSAGE -->

<div
    id="message"
    class="msg">
</div>

</form>

</div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyzNbi14XlQrLOm-BXUaTiMehFCn-P-zp2mp-wLPh-y8S_y06ds3UKf2AFDNDqS-53GcA/exec";


/* =========================================================
   PENGATURAN FOTO
   ========================================================= */

const MAX_IMAGE_WIDTH = 1600;

const MAX_UPLOAD_SIZE =
5 * 1024 * 1024;

const JPEG_QUALITY =
0.80;


/* =========================================================
   ELEMENT
   ========================================================= */

const form =
document.getElementById("productForm");

const idInput =
document.getElementById("id");

const nameInput =
document.getElementById("name");

const descInput =
document.getElementById("desc");

const smallInput =
document.getElementById("small");

const mediumInput =
document.getElementById("medium");

const imageInput =
document.getElementById("image");

const statusInput =
document.getElementById("status");

const preview =
document.getElementById("preview");

const imageInfo =
document.getElementById("imageInfo");

const compressInfo =
document.getElementById("compressInfo");

const submitBtn =
document.getElementById("submitBtn");

const message =
document.getElementById("message");

const progress =
document.getElementById("progress");

const bar =
document.getElementById("bar");

const loading =
document.getElementById("loading");


/* =========================================================
   FILE HASIL KOMPRESI
   ========================================================= */

let compressedImageFile = null;


/* =========================================================
   GENERATE ID
   ========================================================= */

function slugify(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g,"")
        .replace(/\s+/g,"-")
        .replace(/-+/g,"-");

}


function generateProductId(name){

    const slug =
        slugify(name);

    if(!slug){
        return "";
    }

    const random =
        Math.random()
        .toString(36)
        .substring(2,7);

    const time =
        Date.now()
        .toString()
        .slice(-6);

    return (
        slug +
        "-" +
        time +
        "-" +
        random
    );

}


/* =========================================================
   UPDATE ID SAAT NAMA BERUBAH
   ========================================================= */

nameInput.addEventListener(
    "input",
    function(){

        if(
            nameInput.value.trim()
        ){

            idInput.value =
                generateProductId(
                    nameInput.value
                );

        }else{

            idInput.value =
                "";

        }

    }
);


/* =========================================================
   FORMAT FILE
   ========================================================= */

function formatBytes(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) +
    " MB";

}


/* =========================================================
   PESAN
   ========================================================= */

function showSuccess(text){

    message.className =
        "msg ok";

    message.innerHTML =
        text;

}


function showError(text){

    message.className =
        "msg err";

    message.textContent =
        "Gagal: " + text;

}


function clearMessage(){

    message.className =
        "msg";

    message.textContent =
        "";

}


/* =========================================================
   KOMPRES FOTO
   ========================================================= */

function compressImage(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            let width =
                                img.width;

                            let height =
                                img.height;


                            /*
                             * Maksimal 1600px
                             */

                            if(
                                width >
                                MAX_IMAGE_WIDTH ||
                                height >
                                MAX_IMAGE_WIDTH
                            ){

                                if(
                                    width >
                                    height
                                ){

                                    height =
                                        Math.round(
                                            height *
                                            MAX_IMAGE_WIDTH /
                                            width
                                        );

                                    width =
                                        MAX_IMAGE_WIDTH;

                                }else{

                                    width =
                                        Math.round(
                                            width *
                                            MAX_IMAGE_WIDTH /
                                            height
                                        );

                                    height =
                                        MAX_IMAGE_WIDTH;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            if(!ctx){

                                reject(
                                    new Error(
                                        "Canvas tidak didukung browser."
                                    )
                                );

                                return;

                            }


                            /*
                             * Background putih
                             */

                            ctx.fillStyle =
                                "#ffffff";

                            ctx.fillRect(
                                0,
                                0,
                                width,
                                height
                            );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                function(blob){

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Gagal mengompres foto."
                                            )
                                        );

                                        return;

                                    }


                                    const safeName =
                                        file.name
                                        .replace(
                                            /\.[^/.]+$/,
                                            ""
                                        )
                                        .replace(
                                            /[^a-zA-Z0-9-_]/g,
                                            "-"
                                        );


                                    const result =
                                        new File(
                                            [
                                                blob
                                            ],
                                            safeName +
                                            ".jpg",
                                            {
                                                type:
                                                    "image/jpeg",

                                                lastModified:
                                                    Date.now()
                                            }
                                        );


                                    resolve(
                                        result
                                    );

                                },
                                "image/jpeg",
                                JPEG_QUALITY
                            );

                        };


                    img.onerror =
                        function(){

                            reject(
                                new Error(
                                    "Foto tidak dapat dibaca."
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "Gagal membaca foto."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   FILE KE BASE64
   ========================================================= */

function fileToBase64(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    const result =
                        reader.result;


                    if(!result){

                        reject(
                            new Error(
                                "Data foto kosong."
                            )
                        );

                        return;

                    }


                    const commaIndex =
                        result.indexOf(",");


                    if(
                        commaIndex === -1
                    ){

                        reject(
                            new Error(
                                "Format Base64 tidak valid."
                            )
                        );

                        return;

                    }


                    const base64 =
                        result.substring(
                            commaIndex + 1
                        );


                    if(!base64){

                        reject(
                            new Error(
                                "Base64 foto kosong."
                            )
                        );

                        return;

                    }


                    resolve(
                        base64
                    );

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "Gagal membaca Base64."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   PILIH FOTO
   ========================================================= */

imageInput.addEventListener(
    "change",
    async function(){

        const file =
            imageInput.files[0];


        compressedImageFile =
            null;


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            showError(
                "File yang dipilih bukan gambar."
            );

            imageInput.value =
                "";

            return;

        }


        try{

            clearMessage();


            imageInfo.style.display =
                "block";

            imageInfo.innerHTML =
                "Foto asli: " +
                formatBytes(
                    file.size
                );


            compressInfo.style.display =
                "block";

            compressInfo.textContent =
                "Mengoptimalkan foto...";


            const compressed =
                await compressImage(
                    file
                );


            compressedImageFile =
                compressed;


            /*
             * Preview
             */

            if(
                preview.dataset.url
            ){

                URL.revokeObjectURL(
                    preview.dataset.url
                );

            }


            const url =
                URL.createObjectURL(
                    compressed
                );


            preview.dataset.url =
                url;

            preview.src =
                url;

            preview.style.display =
                "block";


            /*
             * Informasi ukuran
             */

            const originalSize =
                file.size;

            const compressedSize =
                compressed.size;


            let saved =
                0;


            if(originalSize > 0){

                saved =
                    Math.round(
                        (
                            1 -
                            compressedSize /
                            originalSize
                        ) * 100
                    );

            }


            imageInfo.innerHTML =
                "Foto asli: " +
                formatBytes(
                    originalSize
                ) +
                "<br>" +
                "Setelah kompresi: " +
                formatBytes(
                    compressedSize
                );


            if(saved > 0){

                compressInfo.textContent =
                    "Foto berhasil dioptimalkan • Hemat sekitar " +
                    saved +
                    "%";

            }else{

                compressInfo.textContent =
                    "Foto berhasil dioptimalkan.";

            }


        }catch(error){

            console.error(
                "COMPRESS ERROR:",
                error
            );


            compressedImageFile =
                null;

            imageInput.value =
                "";

            preview.style.display =
                "none";

            imageInfo.style.display =
                "none";

            compressInfo.style.display =
                "none";


            showError(
                error.message ||
                "Gagal memproses foto."
            );

        }

    }
);


/* =========================================================
   RESET
   ========================================================= */

function resetForm(){

    form.reset();


    idInput.value =
        "";


    compressedImageFile =
        null;


    preview.src =
        "";

    preview.style.display =
        "none";


    if(
        preview.dataset.url
    ){

        URL.revokeObjectURL(
            preview.dataset.url
        );

        delete preview.dataset.url;

    }


    imageInfo.innerHTML =
        "";

    imageInfo.style.display =
        "none";


    compressInfo.innerHTML =
        "";

    compressInfo.style.display =
        "none";

}


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        /* ---------------------------------------------
           CEK URL
        --------------------------------------------- */

        if(
            !API_URL ||
            API_URL.includes("GANTI")
        ){

            showError(
                "URL Google Apps Script belum dikonfigurasi."
            );

            return;

        }


        /* ---------------------------------------------
           DATA
        --------------------------------------------- */

        const name =
            nameInput.value.trim();

        const desc =
            descInput.value.trim();

        const small =
            Number(
                smallInput.value || 0
            );

        const medium =
            Number(
                mediumInput.value || 0
            );

        const status =
            statusInput.value;


        /* ---------------------------------------------
           ID
        --------------------------------------------- */

        let productId =
            idInput.value.trim();


        if(!productId){

            productId =
                generateProductId(
                    name
                );

            idInput.value =
                productId;

        }


        /* ---------------------------------------------
           VALIDASI
        --------------------------------------------- */

        if(!name){

            showError(
                "Nama produk belum diisi."
            );

            nameInput.focus();

            return;

        }


        if(!desc){

            showError(
                "Deskripsi produk belum diisi."
            );

            descInput.focus();

            return;

        }


        if(
            !Number.isFinite(small) ||
            small < 0
        ){

            showError(
                "Harga Small tidak valid."
            );

            smallInput.focus();

            return;

        }


        if(
            !Number.isFinite(medium) ||
            medium < 0
        ){

            showError(
                "Harga Medium tidak valid."
            );

            mediumInput.focus();

            return;

        }


        /*
         * Pastikan sudah ada foto hasil kompresi
         */

        if(!compressedImageFile){

            showError(
                "Silakan pilih foto produk terlebih dahulu."
            );

            imageInput.focus();

            return;

        }


        /* ---------------------------------------------
           CEK UKURAN
        --------------------------------------------- */

        if(
            compressedImageFile.size >
            MAX_UPLOAD_SIZE
        ){

            showError(
                "Foto setelah kompresi masih lebih dari 5 MB."
            );

            return;

        }


        /* ---------------------------------------------
           LOADING
        --------------------------------------------- */

        clearMessage();


        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "Menyiapkan data...";


        loading.style.display =
            "block";


        progress.style.display =
            "block";


        bar.style.width =
            "10%";


        try{

            /* -----------------------------------------
               BASE64
            ----------------------------------------- */

            submitBtn.textContent =
                "Membaca foto...";


            loading.textContent =
                "Mengubah foto menjadi data...";


            bar.style.width =
                "30%";


            const base64 =
                await fileToBase64(
                    compressedImageFile
                );


            if(!base64){

                throw new Error(
                    "Data foto tidak berhasil dibuat."
                );

            }


            /* -----------------------------------------
               PAYLOAD
            ----------------------------------------- */

            const data = {

                id:
                    productId,

                name:
                    name,

                desc:
                    desc,

                small:
                    small,

                medium:
                    medium,

                status:
                    status,

                imageName:
                    compressedImageFile.name,

                imageMimeType:
                    "image/jpeg",

                imageBase64:
                    base64

            };


            console.log(
                "PAYLOAD PRODUK:",
                {
                    id:data.id,
                    name:data.name,
                    desc:data.desc,
                    small:data.small,
                    medium:data.medium,
                    status:data.status,
                    imageName:data.imageName,
                    imageSize:
                        formatBytes(
                            compressedImageFile.size
                        )
                }
            );


            /* -----------------------------------------
               KIRIM
            ----------------------------------------- */

            submitBtn.textContent =
                "Mengirim produk...";


            loading.textContent =
                "Mengirim produk ke Google Sheets...";


            bar.style.width =
                "55%";


            /*
             * Jangan gunakan application/json.
             *
             * Apps Script menerima text/plain
             * melalui doPost().
             */

            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    mode:
                        "no-cors",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            data
                        )
                }
            );


            /* -----------------------------------------
               SELESAI
            ----------------------------------------- */

            bar.style.width =
                "100%";


            loading.textContent =
                "Pengiriman selesai.";


            showSuccess(
                "Produk <b>" +
                name +
                "</b> berhasil dikirim.<br>" +
                "<small>" +
                "Silakan cek Google Sheets dan Google Drive." +
                "</small>"
            );


            /*
             * Reset setelah 2 detik
             */

            setTimeout(
                function(){

                    resetForm();

                },
                2000
            );


        }catch(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );


            showError(
                error.message ||
                "Gagal mengirim produk."
            );

        }finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Simpan Produk";


            setTimeout(
                function(){

                    progress.style.display =
                        "none";

                    bar.style.width =
                        "0%";

                    loading.style.display =
                        "none";

                    loading.textContent =
                        "Sedang mengirim produk...";

                },
                2200
            );

        }

    }
);


/* =========================================================
   CEK KONEKSI SAAT HALAMAN DIBUKA
   ========================================================= */

console.log(
    "Alala Jusss — Input Produk aktif."
);

console.log(
    "API:",
    API_URL
);

</script>

</body>
</html>
