<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alala Jusss — Admin Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--primary:#176b35;--danger:#b42318;--line:#e8edf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
.shell{max-width:1180px;margin:auto;padding:28px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);margin-top:5px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#172033;color:#fff}.btn:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{display:block;font-size:30px;margin-top:8px}.label{color:var(--muted);font-size:13px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;min-width:230px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted);text-transform:uppercase}td{font-size:14px}
.product{display:flex;align-items:center;gap:12px}.product img{width:58px;height:58px;object-fit:cover;border-radius:12px;background:#eef2f5}.product strong{display:block}.product small{color:var(--muted)}
select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-weight:700}.available{color:var(--primary)}.sold{color:var(--danger)}#login{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;max-width:460px;margin:80px auto}.hidden{display:none}.notice{margin:16px 0;padding:12px 14px;border-radius:12px;background:#eef6ef;color:#176b35}.error{background:#fff0ef;color:#b42318}
@media(max-width:650px){.shell{padding:20px 12px 35px}.stats{grid-template-columns:1fr}.stat b{font-size:26px}.brand{font-size:21px}.panelhead{align-items:stretch}input{min-width:100%;width:100%}}
</style>
</head>
<body>
<div id="login">
  <h2>Alala Jusss Admin</h2><p class="sub">Login dengan akun admin untuk mengelola status produk.</p>
  <div id="googleLogin"></div><p id="loginMsg" class="sub"></p>
</div>

<main class="shell hidden" id="app">
  <div class="top"><div><div class="brand">Dashboard Admin</div><div class="sub" id="adminEmail"></div></div><button class="btn" onclick="loadProducts()">↻ Refresh</button></div>
  <div id="notice"></div>
  <section class="stats">
    <div class="stat"><div class="label">TOTAL PRODUK</div><b id="total">0</b></div>
    <div class="stat"><div class="label">TERSEDIA</div><b id="available">0</b></div>
    <div class="stat"><div class="label">HABIS</div><b id="sold">0</b></div>
  </section>
  <section class="panel">
    <div class="panelhead"><div><h3 style="margin:0">Live Produk</h3><div class="sub">Data diambil dari Google Sheets</div></div><input id="search" placeholder="Cari nama produk..." oninput="render()"></div>
    <div class="tablewrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyzNbi14XlQrLOm-BXUaTiMehFCn-P-zp2mp-wLPh-y8S_y06ds3UKf2AFDNDqS-53GcA/exec";
const CLIENT_ID="610820778176-3jm1jub7il9nks4eocm9qt1llsa6phke.apps.googleusercontent.com";
let idToken="", products=[];
function showNotice(msg,error=false){const n=document.getElementById("notice");n.className=error?"notice error":"notice";n.textContent=msg;n.style.display=msg?"block":"none"}
function init(){google.accounts.id.initialize({client_id:CLIENT_ID,callback:credential=>{idToken=credential.credential;loadProducts(true)}});google.accounts.id.renderButton(document.getElementById("googleLogin"),{theme:"outline",size:"large",width:330})}
async function loadProducts(first=false){
 if(API_URL.startsWith("GANTI")){showNotice("Isi API_URL dengan URL Web App Apps Script terlebih dahulu.",true);return}
 try{
  const r=await fetch(API_URL+"?action=adminProducts&idToken="+encodeURIComponent(idToken));const d=await r.json();
  if(!d.success||!d.allowed)throw Error(d.message||"Akses ditolak");
  products=d.products||[];document.getElementById("adminEmail").textContent=d.email||"";
  document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");render();showNotice("Data produk berhasil diperbarui.");
 }catch(e){document.getElementById("loginMsg").textContent=e.message;showNotice(e.message,true)}
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const filtered=products.filter(p=>(p.name+" "+p.id).toLowerCase().includes(q));
 document.getElementById("total").textContent=products.length;
 document.getElementById("available").textContent=products.filter(p=>p.status==="tersedia").length;
 document.getElementById("sold").textContent=products.filter(p=>p.status!=="tersedia").length;
 document.getElementById("rows").innerHTML=filtered.map(p=>`<tr>
 <td><div class="product"><img src="${p.image||''}" onerror="this.style.visibility='hidden'"><div><strong>${esc(p.name)}</strong><small>${esc(p.id)}</small></div></div></td>
 <td>Rp ${money(p.small)}<br><small>Medium: Rp ${money(p.medium)}</small></td>
 <td class="${p.status==='tersedia'?'available':'sold'}">${p.status==='tersedia'?'Tersedia':'Habis'}</td>
 <td><select onchange="changeStatus('${escAttr(p.id)}',this.value)"><option value="tersedia" ${p.status==='tersedia'?'selected':''}>Tersedia</option><option value="habis" ${p.status!=='tersedia'?'selected':''}>Habis</option></select></td>
 </tr>`).join("")||'<tr><td colspan="4">Produk tidak ditemukan.</td></tr>';
}
async function changeStatus(id,status){
 if(!confirm("Ubah status produk menjadi "+status+"?")){render();return}
 try{
  const body=new URLSearchParams({action:"updateStatus",idToken,id,status});
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  const t=await r.text();if(!/Berhasil|success/i.test(t))throw Error("Gagal memperbarui status");
  const p=products.find(x=>x.id===id);if(p)p.status=status;render();showNotice("Status berhasil disimpan ke Google Sheets.");
 }catch(e){showNotice(e.message,true);loadProducts()}
}
function money(v){return Number(v||0).toLocaleString("id-ID")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escAttr(s){return String(s||"").replace(/'/g,"\\'")}
window.onload=()=>{if(window.google)init();else setTimeout(()=>{if(window.google)init()},1200)}
</script>
</body>
</html>
