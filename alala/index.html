<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Input Produk</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.wrap {
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.card {
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 6px 24px #0001;
}

h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.sub {
    color: #666;
    margin: 0 0 20px;
    line-height: 1.5;
}

label {
    display: block;
    font-weight: 700;
    margin: 14px 0 7px;
}

small {
    font-weight: normal;
    color: #777;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #888;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.filebox {
    border: 2px dashed #ccc;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    transition: .2s;
}

.filebox:hover {
    border-color: #999;
}

.filebox input[type="file"] {
    padding: 8px;
    border: 0;
}

.preview {
    width: 100%;
    max-height: 240px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 12px;
    display: none;
    background: #f4f4f4;
}

.image-info {
    margin-top: 8px;
    font-size: 13px;
    color: #666;
    display: none;
    line-height: 1.5;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: 0;
    border-radius: 11px;
    background: #111;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

button:hover:not(:disabled) {
    background: #333;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.msg {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    line-height: 1.5;
}

.ok {
    display: block;
    background: #e8f7ed;
    color: #176b35;
}

.err {
    display: block;
    background: #fdecec;
    color: #a12626;
}

.progress {
    margin-top: 12px;
    height: 8px;
    background: #eee;
    border-radius: 8px;
    overflow: hidden;
    display: none;
}

.bar {
    height: 100%;
    width: 0%;
    background: #333;
    transition: width .25s ease;
}

.compress-info {
    margin-top: 10px;
    font-size: 13px;
    color: #555;
    display: none;
    text-align: center;
}

@media (max-width: 420px) {

    .wrap {
        padding: 10px;
    }

    .card {
        padding: 18px;
    }

    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>

</head>

<body>

<div class="wrap">

```
<div class="card">

    <h1>Tambah Produk</h1>

    <p class="sub">
        Foto dari HP akan otomatis diperkecil dan dikompres
        sebelum dikirim ke Google Drive.
    </p>

    <form id="productForm">

        <!-- ID PRODUK -->
        <label>

        </label>

        <!-- HARGA -->
        <div class="row">

                <input

                <label>

                <input

</div>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP
   PENTING:
   URL HARUS BERUPA URL BIASA, BUKAN MARKDOWN
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz1O7imkZXxSgfdh38ZJW7iSp9ZxIjmlCU04RTWdU7fwdh6E5UtJ_SwxQye4fx1zm7lIA/exec";


/* =====================================================
   PENGATURAN FOTO
===================================================== */

const MAX_IMAGE_SIZE = 1600;
const JPEG_QUALITY = 0.80;
const MAX_UPLOAD_SIZE = 5 * 1024 * 1024;


/* =====================================================
   ELEMENT
===================================================== */

const form = document.getElementById("productForm");
const nameInput = document.getElementById("name");
const idInput = document.getElementById("id");
const imageInput = document.getElementById("image");

const preview = document.getElementById("preview");
const imageInfo = document.getElementById("imageInfo");
const compressInfo = document.getElementById("compressInfo");

const btn = document.getElementById("submitBtn");
const msg = document.getElementById("message");

const progress = document.getElementById("progress");
const bar = document.getElementById("bar");


/* =====================================================
   SLUG / ID PRODUK
===================================================== */

function slugify(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");

}


nameInput.addEventListener("input", function() {

    idInput.value = slugify(nameInput.value);

});


/* =====================================================
   FORMAT BYTES
===================================================== */

function formatBytes(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";

}


/* =====================================================
   KOMPRES FOTO
===================================================== */

function compressImage(file) {

    return new Promise(function(resolve, reject) {

        const reader = new FileReader();

        reader.onload = function(event) {

            const img = new Image();

            img.onload = function() {

                let width = img.width;
                let height = img.height;


                /* BATASI DIMENSI */

                if (
                    width > MAX_IMAGE_SIZE ||
                    height > MAX_IMAGE_SIZE
                ) {

                    if (width > height) {

                        height = Math.round(
                            height *
                            MAX_IMAGE_SIZE /
                            width
                        );

                        width = MAX_IMAGE_SIZE;

                    } else {

                        width = Math.round(
                            width *
                            MAX_IMAGE_SIZE /
                            height
                        );

                        height = MAX_IMAGE_SIZE;

                    }

                }


                /* CANVAS */

                const canvas =
                    document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;


                const ctx =
                    canvas.getContext("2d");

                if (!ctx) {

                    reject(
                        new Error(
                            "Browser tidak mendukung canvas."
                        )
                    );

                    return;
                }


                /* BACKGROUND PUTIH */

                ctx.fillStyle = "#ffffff";

                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );


                /* GAMBAR */

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                /* EXPORT JPEG */

                canvas.toBlob(
                    function(blob) {

                        if (!blob) {

                            reject(
                                new Error(
                                    "Gagal melakukan kompresi foto."
                                )
                            );

                            return;
                        }


                        const originalName =
                            file.name
                                .replace(/\.[^/.]+$/, "")
                                .replace(/[^a-zA-Z0-9-_]/g, "-");


                        const newFile =
                            new File(
                                [blob],
                                originalName + ".jpg",
                                {
                                    type: "image/jpeg",
                                    lastModified: Date.now()
                                }
                            );


                        resolve(newFile);

                    },
                    "image/jpeg",
                    JPEG_QUALITY
                );

            };


            img.onerror = function() {

                reject(
                    new Error(
                        "Foto tidak dapat dibaca."
                    )
                );

            };


            img.src = event.target.result;

        };


        reader.onerror = function() {

            reject(
                new Error(
                    "Gagal membaca file foto."
                )
            );

        };


        reader.readAsDataURL(file);

    });

}


/* =====================================================
   FILE KE BASE64
===================================================== */

function fileToBase64(file) {

    return new Promise(function(resolve, reject) {

        const reader = new FileReader();

        reader.onload = function() {

            const result = reader.result;

            if (!result) {

                reject(
                    new Error(
                        "Data foto kosong."
                    )
                );

                return;
            }

            const parts =
                result.toString().split(",");

            if (parts.length < 2) {

                reject(
                    new Error(
                        "Format Base64 foto tidak valid."
                    )
                );

                return;
            }

            resolve(parts[1]);

        };


        reader.onerror = function() {

            reject(
                new Error(
                    "Gagal mengubah foto menjadi Base64."
                )
            );

        };


        reader.readAsDataURL(file);

    });

}


/* =====================================================
   PREVIEW FOTO
===================================================== */

imageInput.addEventListener(
    "change",
    async function() {

        const originalFile =
            imageInput.files[0];

        if (!originalFile) {
            return;
        }


        if (!originalFile.type.startsWith("image/")) {

            showError(
                "File yang dipilih bukan gambar."
            );

            imageInput.value = "";

            return;
        }


        try {

            imageInfo.style.display = "block";

            imageInfo.innerHTML =
                "Foto asli: " +
                formatBytes(originalFile.size);


            compressInfo.style.display = "block";

            compressInfo.textContent =
                "Mengoptimalkan foto...";


            const compressedFile =
                await compressImage(originalFile);


            /* GANTI FILE INPUT */

            try {

                const dataTransfer =
                    new DataTransfer();

                dataTransfer.items.add(compressedFile);

                imageInput.files =
                    dataTransfer.files;

            } catch (e) {

                console.warn(
                    "Tidak dapat mengganti file input.",
                    e
                );

            }


            /* HAPUS PREVIEW LAMA */

            if (preview.dataset.url) {

                URL.revokeObjectURL(
                    preview.dataset.url
                );

            }


            /* PREVIEW BARU */

            const previewUrl =
                URL.createObjectURL(
                    compressedFile
                );

            preview.dataset.url =
                previewUrl;

            preview.src =
                previewUrl;

            preview.style.display =
                "block";


            /* INFO UKURAN */

            const originalSize =
                originalFile.size;

            const compressedSize =
                compressedFile.size;


            let percentage = 0;

            if (originalSize > 0) {

                percentage =
                    Math.round(
                        (
                            1 -
                            compressedSize /
                            originalSize
                        ) * 100
                    );

            }


            imageInfo.innerHTML =
                "Foto asli: " +
                formatBytes(originalSize) +
                "<br>" +
                "Setelah kompresi: " +
                formatBytes(compressedSize);


            compressInfo.textContent =
                "Foto berhasil dioptimalkan" +
                (
                    percentage > 0
                        ? " • Hemat sekitar " +
                          percentage +
                          "%"
                        : ""
                );


        } catch (error) {

            console.error(error);

            preview.style.display = "none";

            imageInfo.style.display = "none";

            compressInfo.style.display = "none";

            imageInput.value = "";

            showError(
                error.message ||
                "Gagal memproses foto."
            );

        }

    }
);


/* =====================================================
   MESSAGE
===================================================== */

function clearMessage() {

    msg.className = "msg";

    msg.textContent = "";

}


function showSuccess(message) {

    msg.className = "msg ok";

    msg.innerHTML = message;

}


function showError(message) {

    msg.className = "msg err";

    msg.textContent =
        "Gagal: " + message;

}


/* =====================================================
   SUBMIT
===================================================== */

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        /* CEK URL */

        if (
            !API_URL ||
            API_URL.includes("GANTI")
        ) {

            showError(
                "URL Google Apps Script belum dikonfigurasi."
            );

            return;
        }


        /* CEK NAMA */

        const productName =
            nameInput.value.trim();

        if (!productName) {

            showError(
                "Nama produk belum diisi."
            );

            nameInput.focus();

            return;
        }


        /* CEK ID */

        const productId =
            idInput.value.trim();

        if (!productId) {

            showError(
                "ID produk belum dibuat."
            );

            return;
        }


        /* CEK FOTO */

        const file =
            imageInput.files[0];

        if (!file) {

            showError(
                "Pilih foto produk terlebih dahulu."
            );

            return;
        }


        /* CEK UKURAN */

        if (file.size > MAX_UPLOAD_SIZE) {

            showError(
                "Foto masih terlalu besar. Maksimal 5 MB."
            );

            return;
        }


        clearMessage();


        /* LOADING */

        btn.disabled = true;

        btn.textContent =
            "Menyiapkan data...";

        progress.style.display =
            "block";

        bar.style.width =
            "10%";


        try {

            /* AMBIL DATA */

            const formData =
                new FormData(form);

            const data = {};


            formData.forEach(function(value, key) {

                if (key !== "image") {
                    data[key] = value;
                }

            });


            /* KONVERSI HARGA */

            data.small =
                Number(data.small || 0);

            data.medium =
                Number(data.medium || 0);


            /* FOTO */

            data.imageName =
                file.name;

            data.imageMimeType =
                "image/jpeg";


            bar.style.width =
                "30%";

            btn.textContent =
                "Memproses foto...";


            /* BASE64 */

            data.imageBase64 =
                await fileToBase64(file);


            bar.style.width =
                "55%";

            btn.textContent =
                "Mengupload ke Google Sheets...";


            /*
             * KIRIM KE APPS SCRIPT
             *
             * Content-Type text/plain digunakan
             * agar tidak membuat preflight OPTIONS.
             */

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify(data),

                        redirect: "follow"
                    }
                );


            bar.style.width =
                "80%";


            /* CEK HTTP */

            if (!response.ok) {

                throw new Error(
                    "Server mengembalikan HTTP " +
                    response.status
                );

            }


            const responseText =
                await response.text();


            console.log(
                "Response Apps Script:",
                responseText
            );


            if (!responseText) {

                throw new Error(
                    "Apps Script tidak mengembalikan respons."
                );

            }


            let result;


            try {

                result =
                    JSON.parse(
                        responseText
                    );

            } catch (jsonError) {

                console.error(
                    "Response bukan JSON:",
                    responseText
                );

                throw new Error(
                    "Response Google Apps Script tidak valid. Pastikan Apps Script sudah menggunakan doPost(e) yang benar."
                );

            }


            /* CEK HASIL */

            if (!result.success) {

                throw new Error(
                    result.message ||
                    result.error ||
                    "Gagal menyimpan produk."
                );

            }


            /* BERHASIL */

            bar.style.width =
                "100%";


            showSuccess(
                "Produk <b>" +
                productName +
                "</b> berhasil disimpan.<br>" +
                "<small>Data masuk ke Google Sheets dan foto masuk ke Google Drive.</small>"
            );


            /* RESET */

            form.reset();

            idInput.value = "";


            if (preview.dataset.url) {

                URL.revokeObjectURL(
                    preview.dataset.url
                );

                delete preview.dataset.url;

            }


            preview.src = "";

            preview.style.display =
                "none";


            imageInfo.innerHTML =
                "";

            imageInfo.style.display =
                "none";


            compressInfo.textContent =
                "";

            compressInfo.style.display =
                "none";


        } catch (error) {

            console.error(
                "UPLOAD ERROR:",
                error
            );


            showError(
                error.message ||
                "Terjadi kesalahan saat upload."
            );

        } finally {

            btn.disabled =
                false;

            btn.textContent =
                "Simpan Produk";


            setTimeout(
                function() {

                    progress.style.display =
                        "none";

                    bar.style.width =
                        "0%";

                },
                1200
            );

        }

    }
);

</script>
