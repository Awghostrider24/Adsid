<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Produk</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:18px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 6px 24px #0001
}

h1{
  margin:0 0 5px;
  font-size:24px
}

.sub{
  color:#666;
  margin:0 0 20px;
  line-height:1.5
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px
}

small{
  font-weight:normal;
  color:#777
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
  background:#fff
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#888
}

textarea{
  min-height:90px;
  resize:vertical
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.filebox{
  border:2px dashed #ccc;
  border-radius:12px;
  padding:18px;
  text-align:center;
  transition:.2s
}

.filebox:hover{
  border-color:#999
}

.filebox input[type="file"]{
  padding:8px;
  border:0
}

.preview{
  width:100%;
  max-height:240px;
  object-fit:contain;
  border-radius:10px;
  margin-top:12px;
  display:none;
  background:#f4f4f4
}

.image-info{
  margin-top:8px;
  font-size:13px;
  color:#666;
  display:none;
  line-height:1.5
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}

button:hover:not(:disabled){
  background:#333
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5
}

.ok{
  display:block;
  background:#e8f7ed;
  color:#176b35
}

.err{
  display:block;
  background:#fdecec;
  color:#a12626
}

.progress{
  margin-top:12px;
  height:8px;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
  display:none
}

.bar{
  height:100%;
  width:0%;
  background:#333;
  transition:width .25s ease
}

.compress-info{
  margin-top:10px;
  font-size:13px;
  color:#555;
  display:none;
  text-align:center
}

@media(max-width:420px){

  .wrap{
    padding:10px
  }

  .card{
    padding:18px
  }

  .row{
    grid-template-columns:1fr;
    gap:0
  }

}
</style>

</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>Tambah Produk</h1>

    <p class="sub">
      Foto dari HP akan otomatis diperkecil dan dikompres
      sebelum di-upload ke Google Drive.
    </p>


    <form id="productForm">


      <!-- ID PRODUK -->

      <label>
        ID Produk
        <small>(otomatis)</small>
      </label>

      <input
        id="id"
        name="id"
        readonly
        placeholder="Akan dibuat otomatis"
      >


      <!-- NAMA -->

      <label>
        Nama Produk
      </label>

      <input
        id="name"
        name="name"
        required
        placeholder="Contoh: Jus Alpukat"
      >


      <!-- DESKRIPSI -->

      <label>
        Deskripsi
      </label>

      <textarea
        name="desc"
        required
        placeholder="Deskripsi singkat produk"
      ></textarea>


      <!-- HARGA -->

      <div class="row">

        <div>

          <label>
            Harga Small
          </label>

          <input
            name="small"
            type="number"
            min="0"
            required
            placeholder="10000"
          >

        </div>


        <div>

          <label>
            Harga Medium
          </label>

          <input
            name="medium"
            type="number"
            min="0"
            required
            placeholder="14000"
          >

        </div>

      </div>


      <!-- FOTO -->

      <label>
        Foto Produk
      </label>

      <div class="filebox">

        <input
          id="image"
          name="image"
          type="file"
          accept="image/*"
          capture="environment"
          required
        >

        <img
          id="preview"
          class="preview"
          alt="Preview foto produk"
        >

        <div
          id="imageInfo"
          class="image-info"
        ></div>

      </div>


      <div
        id="compressInfo"
        class="compress-info"
      ></div>


      <!-- STATUS -->

      <label>
        Status
      </label>

      <select name="status">

        <option value="tersedia">
          Tersedia
        </option>

        <option value="habis">
          Habis
        </option>

      </select>


      <!-- PROGRESS -->

      <div
        class="progress"
        id="progress"
      >

        <div
          class="bar"
          id="bar"
        ></div>

      </div>


      <!-- SUBMIT -->

      <button
        id="submitBtn"
        type="submit"
      >
        Simpan Produk
      </button>


      <!-- MESSAGE -->

      <div
        id="message"
        class="msg"
      ></div>


    </form>

  </div>

</div>


<script>


// ======================================================
// URL GOOGLE APPS SCRIPT
// ======================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbz1O7imkZXxSgfdh38ZJW7iSp9ZxIjmlCU04RTWdU7fwdh6E5UtJ_SwxQye4fx1zm7lIA/exec';


// ======================================================
// PENGATURAN FOTO
// ======================================================

const MAX_IMAGE_SIZE = 1600;

const JPEG_QUALITY = 0.80;


// ======================================================
// ELEMENT HTML
// ======================================================

const form =
  document.getElementById('productForm');

const nameInput =
  document.getElementById('name');

const idInput =
  document.getElementById('id');

const imageInput =
  document.getElementById('image');

const preview =
  document.getElementById('preview');

const imageInfo =
  document.getElementById('imageInfo');

const compressInfo =
  document.getElementById('compressInfo');

const btn =
  document.getElementById('submitBtn');

const msg =
  document.getElementById('message');

const progress =
  document.getElementById('progress');

const bar =
  document.getElementById('bar');


// ======================================================
// BUAT ID PRODUK OTOMATIS
// ======================================================

function slugify(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-');

}


nameInput.addEventListener(
  'input',
  () => {

    idInput.value =
      slugify(nameInput.value);

  }
);


// ======================================================
// FORMAT UKURAN FILE
// ======================================================

function formatBytes(bytes){

  if(bytes < 1024){

    return bytes + ' B';

  }


  if(bytes < 1024 * 1024){

    return (
      (bytes / 1024).toFixed(1) +
      ' KB'
    );

  }


  return (
    (bytes / (1024 * 1024)).toFixed(2) +
    ' MB'
  );

}


// ======================================================
// KOMPRESI FOTO
// ======================================================

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              // ======================================
              // BATASI UKURAN MAKSIMAL
              // ======================================

              if(
                width > MAX_IMAGE_SIZE ||
                height > MAX_IMAGE_SIZE
              ){

                if(width > height){

                  height =
                    Math.round(
                      height *
                      MAX_IMAGE_SIZE /
                      width
                    );

                  width =
                    MAX_IMAGE_SIZE;

                }else{

                  width =
                    Math.round(
                      width *
                      MAX_IMAGE_SIZE /
                      height
                    );

                  height =
                    MAX_IMAGE_SIZE;

                }

              }


              // ======================================
              // CANVAS
              // ======================================

              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext('2d');


              // Background putih
              ctx.fillStyle =
                '#ffffff';

              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              // ======================================
              // JADIKAN JPEG
              // ======================================

              canvas.toBlob(
                blob => {

                  if(!blob){

                    reject(
                      new Error(
                        'Gagal melakukan kompresi foto.'
                      )
                    );

                    return;

                  }


                  const newFile =
                    new File(
                      [blob],
                      file.name.replace(
                        /\.[^/.]+$/,
                        ''
                      ) + '.jpg',
                      {
                        type:
                          'image/jpeg',

                        lastModified:
                          Date.now()
                      }
                    );


                  resolve(
                    newFile
                  );

                },
                'image/jpeg',
                JPEG_QUALITY
              );

            };


          img.onerror =
            () => {

              reject(
                new Error(
                  'Foto tidak dapat dibaca.'
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              'Gagal membaca file foto.'
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


// ======================================================
// FILE → BASE64
// ======================================================

function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result;


          resolve(
            result.split(',')[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


// ======================================================
// PREVIEW FOTO
// ======================================================

imageInput.addEventListener(
  'change',
  async () => {

    const originalFile =
      imageInput.files[0];


    if(!originalFile){

      return;

    }


    try{

      imageInfo.style.display =
        'block';


      imageInfo.innerHTML =
        'Foto asli: ' +
        formatBytes(
          originalFile.size
        );


      compressInfo.style.display =
        'block';


      compressInfo.textContent =
        'Mengoptimalkan foto...';


      // ============================================
      // KOMPRESI
      // ============================================

      const compressedFile =
        await compressImage(
          originalFile
        );


      // ============================================
      // GANTI FILE INPUT
      // ============================================

      const dataTransfer =
        new DataTransfer();


      dataTransfer.items.add(
        compressedFile
      );


      imageInput.files =
        dataTransfer.files;


      // ============================================
      // HAPUS PREVIEW LAMA
      // ============================================

      if(
        preview.dataset.url
      ){

        URL.revokeObjectURL(
          preview.dataset.url
        );

      }


      // ============================================
      // PREVIEW BARU
      // ============================================

      const previewUrl =
        URL.createObjectURL(
          compressedFile
        );


      preview.dataset.url =
        previewUrl;


      preview.src =
        previewUrl;


      preview.style.display =
        'block';


      // ============================================
      // INFORMASI UKURAN
      // ============================================

      const originalSize =
        originalFile.size;


      const compressedSize =
        compressedFile.size;


      const percentage =
        Math.round(
          (
            1 -
            compressedSize /
            originalSize
          ) * 100
        );


      imageInfo.innerHTML =
        'Foto asli: ' +
        formatBytes(originalSize) +
        '<br>Setelah kompresi: ' +
        formatBytes(compressedSize);


      compressInfo.textContent =
        'Foto berhasil dioptimalkan' +
        (
          percentage > 0
            ? ' • Hemat sekitar ' +
              percentage +
              '%'
            : ''
        );


    }
    catch(error){

      preview.style.display =
        'none';


      imageInfo.style.display =
        'none';


      compressInfo.style.display =
        'none';


      imageInput.value =
        '';


      showError(
        error.message
      );

    }

  }
);


// ======================================================
// MESSAGE
// ======================================================

function clearMessage(){

  msg.className =
    'msg';

  msg.textContent =
    '';

}


function showSuccess(message){

  msg.className =
    'msg ok';

  msg.innerHTML =
    message;

}


function showError(message){

  msg.className =
    'msg err';

  msg.textContent =
    'Gagal: ' +
    message;

}


// ======================================================
// SUBMIT FORM
// ======================================================

form.addEventListener(
  'submit',
  async e => {

    e.preventDefault();


    // ================================================
    // CEK URL
    // ================================================

    if(
      !API_URL ||
      API_URL.includes('GANTI_')
    ){

      showError(
        'URL Apps Script belum dikonfigurasi.'
      );

      return;

    }


    // ================================================
    // CEK FOTO
    // ================================================

    const file =
      imageInput.files[0];


    if(!file){

      showError(
        'Pilih foto produk terlebih dahulu.'
      );

      return;

    }


    // ================================================
    // BATAS FILE
    // ================================================

    if(
      file.size >
      5 * 1024 * 1024
    ){

      showError(
        'Foto setelah kompresi masih terlalu besar. Silakan pilih foto lain.'
      );

      return;

    }


    // ================================================
    // CEK ID
    // ================================================

    if(
      !idInput.value.trim()
    ){

      showError(
        'Nama produk belum diisi.'
      );

      nameInput.focus();

      return;

    }


    clearMessage();


    // ================================================
    // LOADING
    // ================================================

    btn.disabled =
      true;

    btn.textContent =
      'Menyiapkan foto...';


    progress.style.display =
      'block';


    bar.style.width =
      '10%';


    try{

      // ============================================
      // AMBIL DATA FORM
      // ============================================

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );


      data.small =
        Number(data.small);


      data.medium =
        Number(data.medium);


      // ============================================
      // DATA FOTO
      // ============================================

      data.imageName =
        file.name;


      data.imageMimeType =
        'image/jpeg';


      // ============================================
      // PROGRESS
      // ============================================

      bar.style.width =
        '30%';


      btn.textContent =
        'Memproses foto...';


      // ============================================
      // FOTO → BASE64
      // ============================================

      data.imageBase64 =
        await fileToBase64(
          file
        );


      bar.style.width =
        '60%';


      btn.textContent =
        'Mengupload...';


      // ============================================
      // KIRIM KE GOOGLE APPS SCRIPT
      // ============================================

      const response =
        await fetch(
          API_URL,
          {
            method:'POST',

            headers:{
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify(data)
          }
        );


      // ============================================
      // BACA RESPONSE
      // ============================================

      const responseText =
        await response.text();


      console.log(
        'Response Apps Script:',
        responseText
      );


      let result;


      try{

        result =
          JSON.parse(
            responseText
          );

      }
      catch(jsonError){

        throw new Error(
          'Response Apps Script tidak valid: ' +
          responseText.substring(
            0,
            300
          )
        );

      }


      // ============================================
      // CEK HASIL
      // ============================================

      if(
        !result.success
      ){

        throw new Error(
          result.message ||
          result.error ||
          'Gagal menyimpan produk.'
        );

      }


      // ============================================
      // BERHASIL
      // ============================================

      bar.style.width =
        '100%';


      showSuccess(
        'Produk berhasil disimpan.<br>' +
        '<small>Foto otomatis masuk ke Google Drive.</small>'
      );


      // ============================================
      // RESET FORM
      // ============================================

      form.reset();


      idInput.value =
        '';


      preview.src =
        '';


      preview.style.display =
        'none';


      imageInfo.innerHTML =
        '';


      imageInfo.style.display =
        'none';


      compressInfo.textContent =
        '';


      compressInfo.style.display =
        'none';


    }
    catch(error){

      console.error(
        'Upload error:',
        error
      );


      showError(
        error.message ||
        'Terjadi kesalahan saat upload.'
      );

    }
    finally{

      btn.disabled =
        false;


      btn.textContent =
        'Simpan Produk';


      setTimeout(
        () => {

          progress.style.display =
            'none';


          bar.style.width =
            '0%';

        },
        1000
      );

    }

  }
);


</script>

</body>
</html>
