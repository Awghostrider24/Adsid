<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"

>

<title>Alala Jusss - Tambah Produk</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    sans-serif;

  background:#f4f6f8;

  color:#222;

}

.wrap{

  max-width:520px;

  margin:auto;

  padding:18px;

}

.card{

  background:#fff;

  border-radius:18px;

  padding:22px;

  box-shadow:
    0 6px 24px #0001;

}

h1{

  margin:
    0 0 5px;

  font-size:24px;

}

.sub{

  color:#666;

  margin:
    0 0 20px;

  line-height:1.5;

}

label{

  display:block;

  font-weight:700;

  margin:
    14px 0 7px;

}

label small{

  color:#777;

  font-weight:400;

}

input,
textarea,
select{

  width:100%;

  padding:13px;

  border:
    1px solid #ddd;

  border-radius:10px;

  font-size:16px;

  outline:none;

}

input:focus,
textarea:focus,
select:focus{

  border-color:#111;

}

textarea{

  min-height:90px;

  resize:vertical;

}

.row{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

}

.filebox{

  border:
    2px dashed #ccc;

  border-radius:12px;

  padding:18px;

  text-align:center;

}

.preview{

  width:100%;

  max-height:220px;

  object-fit:contain;

  border-radius:10px;

  margin-top:12px;

  display:none;

}

.info{

  margin-top:10px;

  padding:10px;

  border-radius:9px;

  background:#f5f5f5;

  color:#666;

  font-size:13px;

  line-height:1.5;

}

button{

  width:100%;

  margin-top:20px;

  padding:15px;

  border:0;

  border-radius:11px;

  background:#111;

  color:#fff;

  font-size:17px;

  font-weight:700;

  cursor:pointer;

}

button:disabled{

  opacity:.6;

  cursor:not-allowed;

}

.msg{

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  display:none;

  line-height:1.5;

}

.msg.err{

  display:block;

  background:#fdecec;

  color:#a12626;

}

.msg.info{

  display:block;

  background:#eef4ff;

  color:#24518f;

}

.progress{

  margin-top:12px;

  height:8px;

  background:#eee;

  border-radius:8px;

  overflow:hidden;

  display:none;

}

.bar{

  height:100%;

  width:0%;

  background:#333;

  transition:
    width .25s;

}

@media(max-width:420px){

  .row{

    grid-template-columns:
      1fr;

  }

  .card{

    padding:18px;

  }

}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1>
Tambah Produk
</h1>

<p class="sub">
Alala Jusss — Input produk baru.
Foto akan otomatis dikompres sebelum dikirim ke Google Drive.
</p>

<form
  id="productForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbyzNbi14XlQrLOm-BXUaTiMehFCn-P-zp2mp-wLPh-y8S_y06ds3UKf2AFDNDqS-53GcA/exec"
>

<!-- =====================================================
     ID
     ===================================================== -->

<label>
ID Produk
<small>(otomatis)</small>
</label>

<input
id="id"
name="id"
readonly
placeholder="Otomatis dari nama produk"

>

<!-- =====================================================
     NAMA
     ===================================================== -->

<label>
Nama Produk
</label>

<input
id="name"
name="name"
required
placeholder="Contoh: Jus Alpukat"
autocomplete="off"

>

<!-- =====================================================
     DESKRIPSI
     ===================================================== -->

<label>
Deskripsi
</label>

<textarea
  id="desc"
  name="desc"
  required
  placeholder="Deskripsi singkat produk"
></textarea>

<!-- =====================================================
     HARGA
     ===================================================== -->

<div class="row">

<div>

<label>
Harga Small
</label>

<input
id="small"
name="small"
type="number"
min="0"
required
placeholder="10000"

>

</div>

<div>

<label>
Harga Medium
</label>

<input
id="medium"
name="medium"
type="number"
min="0"
required
placeholder="15000"

>

</div>

</div>

<!-- =====================================================
     FOTO
     ===================================================== -->

<label>
Foto Produk
</label>

<div class="filebox">

<input
id="image"
type="file"
accept="image/*"
required

>

<img
id="preview"
class="preview"
alt="Preview Produk"

>

<div class="info">

Foto otomatis diperkecil menjadi
maksimal sekitar 1000px agar upload lebih ringan.

</div>

</div>

<!-- =====================================================
     STATUS
     ===================================================== -->

<label>
Status
</label>

<select
id="status"
name="status"

>

<option value="tersedia">
Tersedia
</option>

<option value="habis">
Tidak tersedia
</option>

</select>

<!-- =====================================================
     HIDDEN FOTO
     ===================================================== -->

<input
type="hidden"
id="imageBase64"
name="imageBase64"

>

<input
type="hidden"
id="imageName"
name="imageName"

>

<input
type="hidden"
id="imageMimeType"
name="imageMimeType"

>



<!-- =====================================================
     BUTTON
     ===================================================== -->

<button
id="submitBtn"
type="submit"

>

Simpan Produk

</button>

<!-- =====================================================
     MESSAGE
     ===================================================== -->

<div
  id="message"
  class="msg"
></div>

</form>

</div>

</div>

<div id="successModal" class="modal" aria-hidden="true">
  <div class="modalcard">
    <div class="successicon">✓</div>
    <h2>Produk Berhasil Disimpan</h2>
    <p id="successDetail">Data produk dan foto berhasil dikirim ke server.</p>
    <button id="modalAddBtn" type="button">Tambah Produk Lagi</button>
  </div>
</div>

<script>

/* =========================================================
   ELEMENT
   ========================================================= */

const form =
  document.getElementById(
    "productForm"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const idInput =
  document.getElementById(
    "id"
  );

const imageInput =
  document.getElementById(
    "image"
  );

const preview =
  document.getElementById(
    "preview"
  );

const imageBase64 =
  document.getElementById(
    "imageBase64"
  );

const imageName =
  document.getElementById(
    "imageName"
  );

const imageMimeType =
  document.getElementById(
    "imageMimeType"
  );

const btn =
  document.getElementById(
    "submitBtn"
  );

const msg =
  document.getElementById(
    "message"
  );

const sizeInfo = document.getElementById("sizeInfo");
const originalSize = document.getElementById("originalSize");
const compressedSize = document.getElementById("compressedSize");
const savingSize = document.getElementById("savingSize");

const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const progressPercent = document.getElementById("progressPercent");

const resetBtn = document.getElementById("resetBtn");
const successModal = document.getElementById("successModal");
const modalAddBtn = document.getElementById("modalAddBtn");


/* =========================================================
   SLUG
   ========================================================= */

function slugify(
  text
){

  return text

    .toLowerCase()

    .trim()

    .replace(
      /[^a-z0-9\s-]/g,
      ""
    )

    .replace(
      /\s+/g,
      "-"
    )

    .replace(
      /-+/g,
      "-"
    );

}


/* =========================================================
   ID OTOMATIS
   ========================================================= */

nameInput.addEventListener(
  "input",
  function(){

    idInput.value =
      slugify(
        nameInput.value
      );

  }
);


/* =========================================================
   PREVIEW
   ========================================================= */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      imageInput.files[0];


    if(!file){

      preview.src = "";

      preview.style.display =
        "none";

      return;

    }


    preview.src =
      URL.createObjectURL(
        file
      );

    preview.style.display =
      "block";

    originalSize.textContent = formatBytes(file.size);
    compressedSize.textContent = "sedang diproses...";
    savingSize.textContent = "-";
    sizeInfo.style.display = "block";

  }
);


/* =========================================================
   KOMPRES FOTO
   ========================================================= */

function compressImage(file, maxWidth = 900, maxHeight = 900, maxBytes = 350 * 1024){

  return new Promise(function(resolve, reject){

    const reader = new FileReader();

    reader.onload = function(event){

      const img = new Image();

      img.onload = async function(){

        try {

          let width = img.width;
          let height = img.height;

          // Batasi dimensi maksimal tanpa mengubah rasio foto.
          const scale = Math.min(
            1,
            maxWidth / width,
            maxHeight / height
          );

          width = Math.max(1, Math.round(width * scale));
          height = Math.max(1, Math.round(height * scale));

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d", {
            alpha: false
          });

          // Background putih agar foto transparan tidak menjadi hitam.
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          // Kompres adaptif. Mulai dari kualitas tinggi lalu turun
          // sampai mendekati target ukuran maksimal.
          let quality = 0.82;
          let blob = await new Promise(function(res){
            canvas.toBlob(res, "image/jpeg", quality);
          });

          while (blob && blob.size > maxBytes && quality > 0.40){

            quality -= 0.07;

            blob = await new Promise(function(res){
              canvas.toBlob(res, "image/jpeg", quality);
            });

          }

          if (!blob){
            reject(
              new Error("Gagal mengompres foto.")
            );
            return;
          }

          resolve(blob);

        } catch(error) {

          reject(error);

        }

      };

      img.onerror = function(){

        reject(
          new Error("Foto tidak dapat dibaca.")
        );

      };

      img.src = event.target.result;

    };

    reader.onerror = function(){

      reject(
        new Error("Gagal membaca foto.")
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================================================
   BASE64
   ========================================================= */

function blobToBase64(
  blob
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            reader.result;


          if(!result){

            reject(
              new Error(
                "Foto kosong."
              )
            );

            return;

          }


          const parts =
            result.split(",");


          if(
            parts.length < 2
          ){

            reject(
              new Error(
                "Format Base64 tidak valid."
              )
            );

            return;

          }


          resolve(
            parts[1]
          );

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Gagal membaca foto."
            )
          );

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =========================================================
   PESAN
   ========================================================= */

function showMessage(
  type,
  text
){

  msg.className =
    "msg " + type;

  msg.innerHTML =
    text;

}


function formatBytes(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function updateSizeInfo(original, compressed){
  compressedSize.textContent = formatBytes(compressed);

  const saved = Math.max(0, original - compressed);
  const percent = original > 0
    ? Math.round((saved / original) * 100)
    : 0;

  savingSize.textContent =
    formatBytes(saved) + " (" + percent + "% lebih kecil)";
}

function resetProductForm(){
  form.reset();
  idInput.value = "";
  preview.src = "";
  preview.style.display = "none";

  imageBase64.value = "";
  imageName.value = "";
  imageMimeType.value = "";

  sizeInfo.style.display = "none";
  originalSize.textContent = "-";
  compressedSize.textContent = "-";
  savingSize.textContent = "-";

  progressBox.style.display = "none";
  progressBar.style.width = "0%";
  progressPercent.textContent = "0%";
  progressText.textContent = "Menyiapkan...";

  msg.className = "msg";
  msg.style.display = "none";

  btn.disabled = false;
  btn.textContent = "Simpan Produk";

  window.scrollTo({top:0, behavior:"smooth"});
}

function openSuccessModal(){
  successModal.classList.add("show");
  successModal.setAttribute("aria-hidden","false");
}

function closeSuccessModal(){
  successModal.classList.remove("show");
  successModal.setAttribute("aria-hidden","true");
}

resetBtn.addEventListener("click", function(){
  resetProductForm();
});

modalAddBtn.addEventListener("click", function(){
  closeSuccessModal();
  resetProductForm();
});

successModal.addEventListener("click", function(e){
  if(e.target === successModal) closeSuccessModal();
});

/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const name =
      nameInput.value.trim();

    const id =
      idInput.value.trim();

    const desc =
      document.getElementById(
        "desc"
      ).value.trim();

    const small =
      document.getElementById(
        "small"
      ).value;

    const medium =
      document.getElementById(
        "medium"
      ).value;


    /* =====================================================
       VALIDASI
       ===================================================== */

    if(!name){

      showMessage(
        "err",
        "Nama produk wajib diisi."
      );

      return;

    }


    if(!id){

      showMessage(
        "err",
        "ID produk belum terbentuk."
      );

      return;

    }


    if(!desc){

      showMessage(
        "err",
        "Deskripsi wajib diisi."
      );

      return;

    }


    if(
      small === "" ||
      Number(small) < 0
    ){

      showMessage(
        "err",
        "Harga Small tidak valid."
      );

      return;

    }


    if(
      medium === "" ||
      Number(medium) < 0
    ){

      showMessage(
        "err",
        "Harga Medium tidak valid."
      );

      return;

    }


    const file =
      imageInput.files[0];


    if(!file){

      showMessage(
        "err",
        "Silakan pilih foto produk."
      );

      return;

    }


    if(
      file.size >
      15 * 1024 * 1024
    ){

      showMessage(
        "err",
        "Ukuran foto asli maksimal 15 MB."
      );

      return;

    }


    /* =====================================================
       LOADING
       ===================================================== */

    btn.disabled =
      true;

    btn.textContent =
      "Mengoptimalkan foto...";


    progressBox.style.display = "block";


    progressBar.style.width = "10%"; progressPercent.textContent = "10%"; progressText.textContent = "Membaca foto...";


    msg.className =
      "msg";


    msg.style.display =
      "none";


    try{


      /* ===================================================
         KOMPRES
         =================================================== */

      const compressed =
        await compressImage(
          file,
          900,
          900,
          350 * 1024
        );


      progressBar.style.width = "35%"; progressPercent.textContent = "35%"; progressText.textContent = "Mengompres foto...";


      if(
        compressed.size >
        500 * 1024
      ){

        throw new Error(
          "Foto setelah dikompres masih terlalu besar. Silakan pilih foto lain."
        );

      }


      /* ===================================================
         BASE64
         =================================================== */

      btn.textContent =
        "Menyiapkan upload...";


      const base64 =
        await blobToBase64(
          compressed
        );


      progressBar.style.width = "55%"; progressPercent.textContent = "55%"; progressText.textContent = "Menyiapkan data...";


      /* ===================================================
         HIDDEN INPUT
         =================================================== */

      imageBase64.value =
        base64;


      imageName.value =
        id + ".jpg";


      imageMimeType.value =
        "image/jpeg";


      /* ===================================================
         DEBUG
         =================================================== */

      console.log(
        "ID:",
        id
      );

      console.log(
        "Nama:",
        name
      );

      console.log(
        "Ukuran asli:",
        Math.round(
          file.size / 1024
        ),
        "KB"
      );

      console.log(
        "Ukuran hasil:",
        Math.round(
          compressed.size / 1024
        ),
        "KB"
      );


      /* ===================================================
         SUBMIT
         =================================================== */

      showMessage(
        "info",

        "<b>Produk siap dikirim.</b><br>" +

        "<small>" +

        "Produk sedang dikirim tanpa membuka tab baru." +

        "</small>"

      );


      progressBar.style.width = "75%"; progressPercent.textContent = "75%"; progressText.textContent = "Mengirim ke server...";


      btn.textContent =
        "Mengirim ke Server...";


      /*
       * ==================================================
       * PENTING
       *
       * TIDAK ADA FETCH
       * TIDAK ADA IFRAME
       *
       * Browser mengirim POST biasa langsung
       * ke Google Apps Script.
       *
       * Target _blank menghindari masalah
       * 403 pada googleusercontent dalam iframe.
       * ==================================================
       */
      /*
       * ==================================================
       * SUBMIT TANPA MEMBUKA TAB BARU
       * ==================================================
       * Form dikirim ke iframe tersembunyi.
       * Halaman utama tetap terbuka.
       */

      let uploadFrame = document.getElementById("uploadFrame");

      if (!uploadFrame) {
        uploadFrame = document.createElement("iframe");
        uploadFrame.id = "uploadFrame";
        uploadFrame.name = "uploadFrame";
        uploadFrame.style.display = "none";
        document.body.appendChild(uploadFrame);
      }

      form.target = "uploadFrame";
      form.submit();

      btn.textContent = "Terkirim ✓";
      bar.style.width = "100%";

      showMessage(
        "info",
        "<b>Produk berhasil dikirim.</b><br>" +
        "<small>Data dan foto sedang diproses oleh server.</small>"
      );setTimeout(function(){
        openSuccessModal();
        resetBtn.style.display = "block";
      }, 700);



    }catch(error){

      console.error(
        error
      );


      showMessage(
        "err",

        "<b>Gagal.</b><br>" +

        "<small>" +

        error.message +

        "</small>"

      );


      btn.disabled =
        false;

      btn.textContent =
        "Simpan Produk";


      progressBox.style.display = "none";

      progressBar.style.width = "0%"; progressPercent.textContent = "0%";

    }

  }
);

</script>

</body>

</html>
