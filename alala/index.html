<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Input Produk - Alala Jusss</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 6px 24px #0001;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:#666;
  margin:0 0 20px;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

label small{
  font-weight:400;
  color:#777;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#111;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.filebox{
  border:2px dashed #ccc;
  border-radius:12px;
  padding:18px;
  text-align:center;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

.info{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  background:#f5f5f5;
  color:#666;
  font-size:13px;
  line-height:1.5;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.msg.ok{
  display:block;
  background:#e8f7ed;
  color:#176b35;
}

.msg.err{
  display:block;
  background:#fdecec;
  color:#a12626;
}

.msg.info-msg{
  display:block;
  background:#eef4ff;
  color:#24518f;
}

.progress{
  margin-top:12px;
  height:8px;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
  display:none;
}

.bar{
  height:100%;
  width:0%;
  background:#333;
  transition:width:.25s;
}

@media(max-width:420px){

  .row{
    grid-template-columns:1fr;
  }

  .card{
    padding:18px;
  }

}
</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1>Tambah Produk</h1>

<p class="sub">
Foto dari HP akan otomatis dikompres dan di-upload ke Google Drive.
</p>

<!-- =====================================================
     FORM UTAMA
     ===================================================== -->

<form
  id="productForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbyzNbi14XlQrLOm-BXUaTiMehFCn-P-zp2mp-wLPh-y8S_y06ds3UKf2AFDNDqS-53GcA/exec"
  target="hiddenFrame"
>

<!-- ID PRODUK -->

<label>
ID Produk <small>(otomatis)</small>
</label>

<input
id="id"
name="id"
readonly
placeholder="Otomatis dari nama produk"

>

<!-- NAMA -->

<label>
Nama Produk
</label>

<input
id="name"
name="name"
required
placeholder="Contoh: Jus Alpukat"
autocomplete="off"

>

<!-- DESKRIPSI -->

<label>
Deskripsi
</label>

<textarea
  id="desc"
  name="desc"
  required
  placeholder="Deskripsi singkat produk"
></textarea>

<!-- HARGA -->

<div class="row">

<div>

<label>
Harga Small
</label>

<input
id="small"
name="small"
type="number"
min="0"
required
placeholder="10000"

>

</div>

<div>

<label>
Harga Medium
</label>

<input
id="medium"
name="medium"
type="number"
min="0"
required
placeholder="14000"

>

</div>

</div>

<!-- FOTO -->

<label>
Foto Produk
</label>

<div class="filebox">

<input
id="image"
type="file"
accept="image/*"
required

>

<img
id="preview"
class="preview"
alt="Preview Produk"

>

<div class="info">
Foto akan otomatis diperkecil menjadi JPEG agar upload lebih ringan.
</div>

</div>

<!-- STATUS -->

<label>
Status
</label>

<select
id="status"
name="status"

>

<option value="tersedia">
Tersedia
</option>

<option value="habis">
Tidak tersedia
</option>

</select>

<!-- INPUT HIDDEN UNTUK FOTO -->

<input
type="hidden"
id="imageBase64"
name="imageBase64"

>

<input
type="hidden"
id="imageName"
name="imageName"

>

<input
type="hidden"
id="imageMimeType"
name="imageMimeType"

>

<!-- PROGRESS -->

<div
  class="progress"
  id="progress"
>

<div
  class="bar"
  id="bar"
></div>

</div>

<!-- BUTTON -->

<button
id="submitBtn"
type="submit"

>

Simpan Produk

</button>

<!-- MESSAGE -->

<div
  id="message"
  class="msg"
></div>

</form>

<!-- =====================================================
     IFRAME TERSEMBUNYI
     ===================================================== -->

<iframe
  name="hiddenFrame"
  id="hiddenFrame"
  style="display:none;"
></iframe>

</div>

</div>

<script>

/* =========================================================
   ELEMENT
   ========================================================= */

const form =
document.getElementById('productForm');

const nameInput =
document.getElementById('name');

const idInput =
document.getElementById('id');

const imageInput =
document.getElementById('image');

const preview =
document.getElementById('preview');

const imageBase64Input =
document.getElementById('imageBase64');

const imageNameInput =
document.getElementById('imageName');

const imageMimeTypeInput =
document.getElementById('imageMimeType');

const btn =
document.getElementById('submitBtn');

const msg =
document.getElementById('message');

const progress =
document.getElementById('progress');

const bar =
document.getElementById('bar');

const hiddenFrame =
document.getElementById('hiddenFrame');


/* =========================================================
   SLUGIFY
   ========================================================= */

function slugify(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-');

}


/* =========================================================
   ID OTOMATIS
   ========================================================= */

nameInput.addEventListener(
  'input',
  function(){

    idInput.value =
      slugify(
        nameInput.value
      );

  }
);


/* =========================================================
   PREVIEW FOTO
   ========================================================= */

imageInput.addEventListener(
  'change',
  function(){

    const file =
      imageInput.files[0];

    if(!file){

      preview.src = '';
      preview.style.display =
        'none';

      return;

    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      'block';

  }
);


/* =========================================================
   KOMPRES FOTO
   ========================================================= */

function compressImage(
  file,
  maxWidth,
  quality
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              /* =========================================
                 BATASI LEBAR
                 ========================================= */

              if(width > maxWidth){

                height =
                  Math.round(
                    height *
                    maxWidth /
                    width
                  );

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                function(blob){

                  if(!blob){

                    reject(
                      new Error(
                        'Gagal mengompres foto.'
                      )
                    );

                    return;

                  }

                  resolve(blob);

                },
                'image/jpeg',
                quality
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  'Foto tidak dapat dibaca.'
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              'Gagal membaca foto.'
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   BLOB KE BASE64
   ========================================================= */

function blobToBase64(blob){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            reader.result;

          if(!result){

            reject(
              new Error(
                'Hasil foto kosong.'
              )
            );

            return;

          }


          const parts =
            result.split(',');


          if(parts.length < 2){

            reject(
              new Error(
                'Format Base64 foto tidak valid.'
              )
            );

            return;

          }


          resolve(
            parts[1]
          );

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              'Gagal membaca Base64 foto.'
            )
          );

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =========================================================
   PESAN
   ========================================================= */

function showMessage(
  type,
  text
){

  msg.className =
    'msg ' + type;

  msg.innerHTML =
    text;

}


/* =========================================================
   FLAG SUBMIT
   ========================================================= */

let submitting =
  false;


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  'submit',
  async function(e){

    /*
     * Jangan biarkan submit asli terjadi
     * sebelum Base64 selesai dibuat.
     */

    e.preventDefault();


    if(submitting){

      return;

    }


    /* =========================================
       VALIDASI DASAR
       ========================================= */

    const name =
      nameInput.value.trim();

    const id =
      idInput.value.trim();

    const desc =
      document.getElementById(
        'desc'
      ).value.trim();

    const small =
      document.getElementById(
        'small'
      ).value;

    const medium =
      document.getElementById(
        'medium'
      ).value;


    if(!name){

      showMessage(
        'err',
        'Nama produk wajib diisi.'
      );

      return;

    }


    if(!id){

      showMessage(
        'err',
        'ID produk belum terbentuk.'
      );

      return;

    }


    if(!desc){

      showMessage(
        'err',
        'Deskripsi produk wajib diisi.'
      );

      return;

    }


    if(small === '' || Number(small) < 0){

      showMessage(
        'err',
        'Harga Small tidak valid.'
      );

      return;

    }


    if(
      medium === '' ||
      Number(medium) < 0
    ){

      showMessage(
        'err',
        'Harga Medium tidak valid.'
      );

      return;

    }


    /* =========================================
       CEK FOTO
       ========================================= */

    const file =
      imageInput.files[0];


    if(!file){

      showMessage(
        'err',
        'Silakan pilih foto produk.'
      );

      return;

    }


    /* =========================================
       BATAS FOTO ASLI
       ========================================= */

    if(
      file.size >
      15 * 1024 * 1024
    ){

      showMessage(
        'err',
        'Ukuran foto asli maksimal 15 MB.'
      );

      return;

    }


    submitting =
      true;


    btn.disabled =
      true;

    btn.textContent =
      'Menyiapkan foto...';


    msg.className =
      'msg';


    msg.style.display =
      'none';


    progress.style.display =
      'block';


    bar.style.width =
      '10%';


    try{

      /* =======================================
         KOMPRES FOTO
         ======================================= */

      const compressedBlob =
        await compressImage(
          file,
          1000,
          0.65
        );


      bar.style.width =
        '30%';


      btn.textContent =
        'Mengolah foto...';


      /* =======================================
         BATAS HASIL KOMPRES
         ======================================= */

      if(
        compressedBlob.size >
        2 * 1024 * 1024
      ){

        throw new Error(
          'Foto setelah dikompres masih terlalu besar. Silakan pilih foto lain.'
        );

      }


      /* =======================================
         BASE64
         ======================================= */

      const base64 =
        await blobToBase64(
          compressedBlob
        );


      bar.style.width =
        '50%';


      /* =======================================
         MASUKKAN KE INPUT HIDDEN
         ======================================= */

      imageBase64Input.value =
        base64;

      imageNameInput.value =
        id + '.jpg';

      imageMimeTypeInput.value =
        'image/jpeg';


      /* =======================================
         CEK BASE64
         ======================================= */

      if(
        !imageBase64Input.value
      ){

        throw new Error(
          'Base64 foto kosong.'
        );

      }


      console.log(
        'Foto berhasil dikompres.'
      );

      console.log(
        'Ukuran asli:',
        Math.round(
          file.size / 1024
        ),
        'KB'
      );

      console.log(
        'Ukuran hasil:',
        Math.round(
          compressedBlob.size / 1024
        ),
        'KB'
      );

      console.log(
        'Base64:',
        Math.round(
          base64.length / 1024
        ),
        'KB'
      );


      /* =======================================
         SUBMIT FORM BIASA
         ======================================= */

      btn.textContent =
        'Menyimpan produk...';


      bar.style.width =
        '70%';


      /*
       * PENTING:
       *
       * Tidak menggunakan fetch().
       *
       * Form langsung POST ke:
       * script.google.com/macros/s/.../exec
       *
       * Response diarahkan ke iframe.
       */

      form.submit();


      bar.style.width =
        '90%';


      showMessage(
        'info-msg',
        '<b>Produk sedang disimpan...</b><br>' +
        '<small>Mohon tunggu beberapa detik.</small>'
      );


      /*
       * Karena response Apps Script masuk
       * ke iframe, kita tidak perlu membaca
       * response dengan JavaScript.
       *
       * Setelah beberapa detik kita anggap
       * proses server selesai.
       */

      setTimeout(
        function(){

          bar.style.width =
            '100%';


          showMessage(
            'ok',
            '<b>Permintaan penyimpanan telah dikirim.</b><br>' +
            '<small>' +
            'Silakan cek Google Sheet. Jika foto digunakan, cek juga folder Google Drive.' +
            '</small>'
          );


          form.reset();

          idInput.value =
            '';

          imageBase64Input.value =
            '';

          imageNameInput.value =
            '';

          imageMimeTypeInput.value =
            '';

          preview.src =
            '';

          preview.style.display =
            'none';


          btn.disabled =
            false;

          btn.textContent =
            'Simpan Produk';

          submitting =
            false;


          setTimeout(
            function(){

              progress.style.display =
                'none';

              bar.style.width =
                '0%';

            },
            1500
          );


        },
        5000
      );


    }catch(error){

      console.error(
        'ERROR:',
        error
      );


      showMessage(
        'err',
        '<b>Gagal menyiapkan produk.</b><br>' +
        '<small>' +
        error.message +
        '</small>'
      );


      btn.disabled =
        false;

      btn.textContent =
        'Simpan Produk';

      submitting =
        false;


      progress.style.display =
        'none';

      bar.style.width =
        '0%';

    }

  }
);


/* =========================================================
   FRAME LOAD
   ========================================================= */

hiddenFrame.addEventListener(
  'load',
  function(){

    /*
     * Response Apps Script memang masuk
     * ke iframe.
     *
     * Kita sengaja tidak membaca isi iframe
     * karena berasal dari domain berbeda.
     */

    console.log(
      'Response Apps Script diterima oleh iframe.'
    );

  }
);

</script>

</body>
</html>
