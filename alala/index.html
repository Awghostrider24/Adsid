<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Input Produk - Alala Jusss</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 6px 24px #0001;
}

h1{
  margin:0 0 5px;
  font-size:24px;
}

.sub{
  color:#666;
  margin:0 0 20px;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

small{
  font-weight:400;
  color:#777;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#111;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.filebox{
  border:2px dashed #ccc;
  border-radius:12px;
  padding:18px;
  text-align:center;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.ok{
  display:block;
  background:#e8f7ed;
  color:#176b35;
}

.err{
  display:block;
  background:#fdecec;
  color:#a12626;
}

.progress{
  margin-top:12px;
  height:8px;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
  display:none;
}

.bar{
  height:100%;
  width:0%;
  background:#333;
  transition:width .2s;
}

.info{
  margin-top:12px;
  padding:10px;
  border-radius:9px;
  background:#f5f5f5;
  font-size:13px;
  color:#666;
}

@media(max-width:420px){
  .row{
    grid-template-columns:1fr;
  }

  .card{
    padding:18px;
  }
}
</style>

</head>

<body>

<div class="wrap">

  <div class="card">

  </div>

<script>

/* =========================================================
   URL GOOGLE APPS SCRIPT
   ========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbyzNbi14XlQrLOm-BXUaTiMehFCn-P-zp2mp-wLPh-y8S_y06ds3UKf2AFDNDqS-53GcA/exec';


/* =========================================================
   ELEMENT
   ========================================================= */

const form =
document.getElementById('productForm');

const nameInput =
document.getElementById('name');

const idInput =
document.getElementById('id');

const imageInput =
document.getElementById('image');

const preview =
document.getElementById('preview');

const btn =
document.getElementById('submitBtn');

const msg =
document.getElementById('message');

const progress =
document.getElementById('progress');

const bar =
document.getElementById('bar');


/* =========================================================
   SLUG ID
   ========================================================= */

function slugify(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-');

}


/* =========================================================
   ID OTOMATIS
   ========================================================= */

nameInput.addEventListener(
  'input',
  function(){

    idInput.value =
      slugify(nameInput.value);

  }
);


/* =========================================================
   PREVIEW FOTO
   ========================================================= */

imageInput.addEventListener(
  'change',
  function(){

    const file =
      imageInput.files[0];

    if(!file){

      preview.style.display =
        'none';

      return;

    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      'block';

  }
);


/* =========================================================
   KOMPRES FOTO
   ========================================================= */

function compressImage(
  file,
  maxWidth = 1000,
  quality = 0.65
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(event){

          const img =
            new Image();

          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              /* =========================================
                 BATASI UKURAN FOTO
                 ========================================= */

              if(width > maxWidth){

                height =
                  Math.round(
                    height *
                    maxWidth /
                    width
                  );

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                function(blob){

                  if(!blob){

                    reject(
                      new Error(
                        'Gagal mengompres foto.'
                      )
                    );

                    return;

                  }

                  resolve(blob);

                },
                'image/jpeg',
                quality
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  'Foto tidak dapat dibaca.'
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              'Gagal membaca foto.'
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   BLOB → BASE64
   ========================================================= */

function blobToBase64(blob){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const result =
            reader.result;

          const base64 =
            result.split(',')[1];

          resolve(base64);

        };

      reader.onerror =
        function(){

          reject(
            new Error(
              'Gagal mengubah foto ke Base64.'
            )
          );

        };

      reader.readAsDataURL(blob);

    }
  );

}


/* =========================================================
   TAMPILKAN PESAN
   ========================================================= */

function showMessage(
  type,
  text
){

  msg.className =
    'msg ' + type;

  msg.innerHTML =
    text;

}


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  'submit',
  async function(e){

    e.preventDefault();


    /* =========================================
       CEK URL
       ========================================= */

    if(
      !API_URL ||
      API_URL.includes('GANTI_')
    ){

      showMessage(
        'err',
        'URL Apps Script belum diatur.'
      );

      return;

    }


    /* =========================================
       CEK FOTO
       ========================================= */

    const originalFile =
      imageInput.files[0];

    if(!originalFile){

      showMessage(
        'err',
        'Silakan pilih foto produk.'
      );

      return;

    }


    /* =========================================
       BATAS FOTO ASLI
       ========================================= */

    if(
      originalFile.size >
      15 * 1024 * 1024
    ){

      showMessage(
        'err',
        'Ukuran foto asli maksimal 15 MB.'
      );

      return;

    }


    /* =========================================
       DISABLE BUTTON
       ========================================= */

    btn.disabled =
      true;

    btn.textContent =
      'Menyiapkan foto...';

    msg.className =
      'msg';

    msg.style.display =
      'none';

    progress.style.display =
      'block';

    bar.style.width =
      '10%';


    try{

      /* =======================================
         KOMPRES FOTO
         ======================================= */

      const compressedBlob =
        await compressImage(
          originalFile,
          1000,
          0.65
        );

      bar.style.width =
        '30%';


      /* =======================================
         CEK HASIL KOMPRESI
         ======================================= */

      if(
        compressedBlob.size >
        2 * 1024 * 1024
      ){

        throw new Error(
          'Foto setelah dikompres masih terlalu besar. Silakan gunakan foto yang lebih kecil.'
        );

      }


      /* =======================================
         BASE64
         ======================================= */

      btn.textContent =
        'Membaca foto...';

      const imageBase64 =
        await blobToBase64(
          compressedBlob
        );

      bar.style.width =
        '50%';


      /* =======================================
         DATA FORM
         ======================================= */

      const formData =
        new FormData(form);

      const data =
        Object.fromEntries(
          formData.entries()
        );


      /* =======================================
         DATA NUMERIK
         ======================================= */

      data.small =
        Number(data.small || 0);

      data.medium =
        Number(data.medium || 0);


      /* =======================================
         DATA FOTO
         ======================================= */

      data.imageName =
        data.id + '.jpg';

      data.imageMimeType =
        'image/jpeg';

      data.imageBase64 =
        imageBase64;


      /* =======================================
         STATUS
         ======================================= */

      if(
        data.status ===
        'tidak tersedia'
      ){

        data.status =
          'habis';

      }


      /* =======================================
         DEBUG
         ======================================= */

      console.log(
        'DATA YANG DIKIRIM:',
        {
          id:data.id,
          name:data.name,
          desc:data.desc,
          small:data.small,
          medium:data.medium,
          status:data.status,
          imageSize:
            Math.round(
              imageBase64.length / 1024
            ) + ' KB'
        }
      );


      /* =======================================
         KIRIM KE APPS SCRIPT
         ======================================= */

      btn.textContent =
        'Menyimpan ke Google Sheet...';


      /*
       * PENTING:
       *
       * Content-Type dibuat text/plain.
       *
       * Code.gs Anda sudah membaca:
       * e.postData.contents
       *
       * lalu JSON.parse().
       */

      const response =
        await fetch(
          API_URL,
          {
            method:'POST',

            headers:{
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify(data)
          }
        );


      bar.style.width =
        '80%';


      /* =======================================
         CEK HTTP
         ======================================= */

      if(!response.ok){

        throw new Error(
          'Server Apps Script mengembalikan HTTP ' +
          response.status
        );

      }


      /* =======================================
         BACA RESPONSE
         ======================================= */

      const responseText =
        await response.text();


      console.log(
        'RESPONSE APPS SCRIPT:',
        responseText
      );


      if(!responseText){

        throw new Error(
          'Apps Script tidak memberikan response.'
        );

      }


      let result;

      try{

        result =
          JSON.parse(
            responseText
          );

      }catch(parseError){

        console.error(
          'Response bukan JSON:',
          responseText
        );

        throw new Error(
          'Response Apps Script bukan JSON. Periksa deployment Web App.'
        );

      }


      /* =======================================
         CEK SUCCESS
         ======================================= */

      if(
        !result.success
      ){

        throw new Error(
          result.message ||
          'Produk gagal disimpan.'
        );

      }


      /* =======================================
         BERHASIL
         ======================================= */

      bar.style.width =
        '100%';

      showMessage(
        'ok',
        '<b>Produk berhasil disimpan.</b><br>' +
        '<small>' +
        'Produk sudah masuk ke Google Sheet dan foto sudah di-upload ke Google Drive.' +
        '</small>'
      );


      /* =======================================
         RESET FORM
         ======================================= */

      form.reset();

      idInput.value =
        '';

      preview.src =
        '';

      preview.style.display =
        'none';


      console.log(
        'PRODUK BERHASIL:',
        result
      );


    }catch(error){

      console.error(
        'ERROR UPLOAD:',
        error
      );


      showMessage(
        'err',
        '<b>Gagal menyimpan produk.</b><br>' +
        '<small>' +
        error.message +
        '</small>'
      );


    }finally{

      btn.disabled =
        false;

      btn.textContent =
        'Simpan Produk';


      setTimeout(
        function(){

          progress.style.display =
            'none';

          bar.style.width =
            '0%';

        },
        1200
      );

    }

  }
);

</script>

</body>
