  <style>

    * {

    body {

        Arial,

    .container {

    .card {

      background: #ffffff;

      padding: 25px;

      border-radius: 18px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.10);

    }


    .header {

      text-align: center;

      margin-bottom: 25px;

    }


    .header-icon {

      font-size: 45px;

      margin-bottom: 5px;

    }


    h2 {

      margin: 0;

      color: #2e7d32;

    }


    .subtitle {

      margin-top: 8px;

      color: #777;

      font-size: 14px;

    }


    /* =====================================================
       USER INFO
    ====================================================== */

    .user-box {

      background: #e8f5e9;

      border-left:
        4px solid #2e7d32;

      padding: 12px;

      border-radius: 8px;

      margin-bottom: 20px;

      font-size: 14px;

      color: #333;

    }


    /* =====================================================
       FORM
    ====================================================== */

    .form-group {

      margin-bottom: 15px;

    }


    label {

      display: block;

      margin-bottom: 6px;

      font-weight: bold;

      color: #333;

      font-size: 14px;

    }


    input,
    select {

      width: 100%;

      padding: 13px;

      border:
        1px solid #ccc;

      border-radius: 9px;

      font-size: 16px;

      outline: none;

      background: #fff;

    }


    input:focus,
    select:focus {

      border-color: #2e7d32;

      box-shadow:
        0 0 0 2px
        rgba(46,125,50,.10);

    }


    /* =====================================================
       READ ONLY
    ====================================================== */

    .readonly {

      background: #f1f3f4;

      color: #555;

    }


    /* =====================================================
       BUTTON
    ====================================================== */

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;

    }


    #loginBtn {

      background: #2e7d32;

      color: white;

    }


    #saveBtn {

      background: #2e7d32;

      color: white;

      margin-top: 10px;

    }


    #saveBtn:disabled {

      background: #9e9e9e;

      cursor: not-allowed;

    }


    #logoutBtn {

      background: #c62828;

      color: white;

      margin-top: 10px;

    }


    button:hover {

      opacity: .92;

    }


    /* =====================================================
       STATUS
    ====================================================== */

    #status {

      text-align: center;

      margin-top: 15px;

      font-weight: bold;

      font-size: 14px;

    }


    .success {

      color: #2e7d32;

    }


    .error {

      color: #c62828;

    }


    .loading {

      color: #ef6c00;

    }


    /* =====================================================
       RINGKASAN
    ====================================================== */

    .summary {

      margin-top: 20px;

      padding: 15px;

      background: #f8f9fa;

      border-radius: 10px;

      display: none;

    }


    .summary-title {

      font-weight: bold;

      margin-bottom: 10px;

      color: #333;

    }


    .summary-row {

      display: flex;

      justify-content: space-between;

      margin-top: 7px;

      font-size: 14px;

    }


    .summary-net {

      font-weight: bold;

      color: #2e7d32;

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 480px) {

      body {

        padding: 10px;

      }

      .card {

        padding: 20px;

      }

      h2 {

        font-size: 21px;

      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="card">

<script>


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDFMqBgt1F3gGtXsTUo4NiqjkxE_QYf5Xs",

  authDomain:
    "zmart-8320a.firebaseapp.com",

  projectId:
    "zmart-8320a"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzkJ1k0pvHCUbVk7HUXCTSmapVtUZoN5hxYKR6jEbNcXUJUcygwoawez6_gEen1h07A/exec";


/* =========================================================
   ELEMENT
========================================================= */

const loginBtn =
  document.getElementById("loginBtn");

const form =
  document.getElementById("form");

const userInfo =
  document.getElementById("userInfo");

const saveBtn =
  document.getElementById("saveBtn");

const status =
  document.getElementById("status");


/* =========================================================
   LOGIN GOOGLE
========================================================= */

loginBtn.addEventListener(
  "click",
  function() {

    const provider =
      new firebase.auth.GoogleAuthProvider();

    auth
      .signInWithPopup(provider)

      .catch(function(error) {

        alert(
          "Login gagal: " +
          error.message
        );

      });

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(
  function(user) {

    if (user) {

      loginBtn.style.display =
        "none";

      form.style.display =
        "block";


      userInfo.innerHTML =

        "👤 <b>" +
        escapeHTML(
          user.displayName || "User"
        ) +
        "</b>" +

        "<br>" +

        "📧 " +
        escapeHTML(
          user.email
        );


      /*
       Nama dari akun Google
       otomatis menjadi nama awal
      */

      document
        .getElementById(
          "namaMustahik"
        )
        .value =
        user.displayName || "";


    } else {

      loginBtn.style.display =
        "block";

      form.style.display =
        "none";

      status.innerText = "";

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    function() {

      auth.signOut();

    }
  );


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function formatRupiah(
  angka
) {

  return new Intl.NumberFormat(
    "id-ID",
    {

      style: "currency",

      currency: "IDR",

      maximumFractionDigits: 0

    }
  ).format(
    angka || 0
  );

}


/* =========================================================
   HITUNG PENDAPATAN BERSIH
========================================================= */

function hitungPendapatanBersih() {


  const omset =
    Number(
      document
        .getElementById("omset")
        .value
    ) || 0;


  const kulakan =
    Number(
      document
        .getElementById("kulakan")
        .value
    ) || 0;


  const bersih =
    omset - kulakan;


  document
    .getElementById(
      "pendapatanBersih"
    )
    .value =
    formatRupiah(
      bersih
    );


  /*
   UPDATE RINGKASAN
  */


  document
    .getElementById(
      "summaryOmset"
    )
    .innerText =
    formatRupiah(
      omset
    );


  document
    .getElementById(
      "summaryKulakan"
    )
    .innerText =
    formatRupiah(
      kulakan
    );


  document
    .getElementById(
      "summaryBersih"
    )
    .innerText =
    formatRupiah(
      bersih
    );


  const tambahan =
    Number(
      document
        .getElementById(
          "pendapatanTambahan"
        )
        .value
    ) || 0;


  document
    .getElementById(
      "summaryTambahan"
    )
    .innerText =
    formatRupiah(
      tambahan
    );


  document
    .getElementById(
      "summary"
    )
    .style.display =
    "block";

}


/* =========================================================
   EVENT PERHITUNGAN
========================================================= */

document
  .getElementById("omset")
  .addEventListener(
    "input",
    hitungPendapatanBersih
  );


document
  .getElementById("kulakan")
  .addEventListener(
    "input",
    hitungPendapatanBersih
  );


document
  .getElementById(
    "pendapatanTambahan"
  )
  .addEventListener(
    "input",
    hitungPendapatanBersih
  );


/* =========================================================
   SIMPAN DATA
========================================================= */

saveBtn.addEventListener(
  "click",
  async function() {


    if (!auth.currentUser) {

      alert(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    /*
     AMBIL DATA
    */

    const namaMustahik =
      document
        .getElementById(
          "namaMustahik"
        )
        .value
        .trim();


    const bulan =
      document
        .getElementById(
          "bulan"
        )
        .value;


    const tahun =
      document
        .getElementById(
          "tahun"
        )
        .value;


    const kecamatan =
      document
        .getElementById(
          "kecamatan"
        )
        .value
        .trim();


    const omset =
      Number(
        document
          .getElementById(
            "omset"
          )
          .value
      );


    const kulakan =
      Number(
        document
          .getElementById(
            "kulakan"
          )
          .value
      );


    const pendapatanTambahan =
      Number(
        document
          .getElementById(
            "pendapatanTambahan"
          )
          .value
      );


    /*
     VALIDASI
    */

    if (!namaMustahik) {

      alert(
        "Nama Mustahik wajib diisi."
      );

      return;

    }


    if (!bulan) {

      alert(
        "Silakan pilih bulan."
      );

      return;

    }


    if (!tahun) {

      alert(
        "Silakan pilih tahun."
      );

      return;

    }


    if (!kecamatan) {

      alert(
        "Kecamatan wajib diisi."
      );

      return;

    }


    if (
      isNaN(omset) ||
      omset < 0
    ) {

      alert(
        "Omset tidak valid."
      );

      return;

    }


    if (
      isNaN(kulakan) ||
      kulakan < 0
    ) {

      alert(
        "Kulakan tidak valid."
      );

      return;

    }


    if (
      isNaN(pendapatanTambahan) ||
      pendapatanTambahan < 0
    ) {

      alert(
        "Pendapatan tambahan tidak valid."
      );

      return;

    }


    /*
     HITUNG BERSIH
    */

    const pendapatanBersih =
      omset - kulakan;


    /*
     BULAN TAHUN
    */

    const bulanTahun =
      bulan +
      " " +
      tahun;


    /*
     WAKTU
    */

    const sekarang =
      new Date();


    const waktuDanTanggal =
      sekarang.toLocaleString(
        "id-ID",
        {

          timeZone:
            "Asia/Jakarta"

        }
      );


    try {


      /*
       AMBIL FIREBASE TOKEN
      */

      const token =
        await auth.currentUser
          .getIdToken();


      /*
       PAYLOAD
      */

      const payload = {

        idToken:
          token,

        uid:
          auth.currentUser.uid,

        email:
          auth.currentUser.email,

        waktuDanTanggal:
          waktuDanTanggal,

        namaMustahik:
          namaMustahik,

        bulanTahun:
          bulanTahun,

        kecamatan:
          kecamatan,

        omset:
          omset,

        kulakan:
          kulakan,

        pendapatanBersih:
          pendapatanBersih,

        pendapatanTambahan:
          pendapatanTambahan

      };


      /*
       TAMPILKAN LOADING
      */

      saveBtn.disabled =
        true;

      saveBtn.innerText =
        "⏳ Menyimpan...";

      status.className =
        "loading";

      status.innerText =
        "Sedang menyimpan data...";


      /*
       KIRIM KE GOOGLE APPS SCRIPT
      */

      const response =
        await fetch(
          SCRIPT_URL,
          {

            method: "POST",

            body:
              new URLSearchParams(
                payload
              )

          }
        );


      const result =
        await response.text();


      /*
       CEK RESPONSE
      */

      if (
        result.trim() !== "OK"
      ) {

        throw new Error(
          result
        );

      }


      /*
       BERHASIL
      */

      status.className =
        "success";

      status.innerText =
        "✅ Data berhasil disimpan";


      /*
       RESET FORM
      */

      document
        .getElementById(
          "bulan"
        )
        .value = "";


      document
        .getElementById(
          "tahun"
        )
        .value = "";


      document
        .getElementById(
          "kecamatan"
        )
        .value = "";


      document
        .getElementById(
          "omset"
        )
        .value = "";


      document
        .getElementById(
          "kulakan"
        )
        .value = "";


      document
        .getElementById(
          "pendapatanBersih"
        )
        .value = "";


      document
        .getElementById(
          "pendapatanTambahan"
        )
        .value = "";


      document
        .getElementById(
          "summary"
        )
        .style.display =
        "none";


    }

    catch(error) {


      status.className =
        "error";


      status.innerText =
        "";


      alert(
        "Gagal menyimpan data:\n\n" +
        error.message
      );

    }


    finally {

      saveBtn.disabled =
        false;

      saveBtn.innerText =
        "💾 Simpan Data";

    }

  }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


</script>

</body>

</html>
