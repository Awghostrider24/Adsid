/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
    "click",
    async function(){

        const provider =
            new firebase.auth.GoogleAuthProvider();

        const status =
            document.getElementById("loginStatus");

        try{
            loginBtn.disabled = true;
            loginBtn.innerText = "⏳ Login...";

            if(status){
                status.className = "status loading";
                status.innerText = "Menghubungkan akun...";
            }

            await auth.signInWithPopup(provider);

            // Jangan redirect di sini.
            // Firebase akan menjalankan onAuthStateChanged().
        }
        catch(error){
            console.error("Login error:", error);

            if(status){
                status.className = "status error";
                status.innerText =
                    "Login gagal: " +
                    (error.message || "Terjadi kesalahan");
            }

            loginBtn.disabled = false;
            loginBtn.innerText = "🔐 Login dengan Google";
        }
    }
);


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(
    async function(user){

        if(!user){
            loginPage.style.display = "flex";
            app.style.display = "none";

            loginBtn.disabled = false;
            loginBtn.innerText = "🔐 Login dengan Google";
            return;
        }

        try{
            loginPage.style.display = "none";
            app.style.display = "block";

            await loadCurrentUser(user);
        }
        catch(error){
            console.error("Auth state error:", error);

            loginPage.style.display = "flex";
            app.style.display = "none";

            loginBtn.disabled = false;
            loginBtn.innerText = "🔐 Login dengan Google";

            const status =
                document.getElementById("loginStatus");

            if(status){
                status.className = "status error";
                status.innerText =
                    "Gagal mengambil data user: " +
                    (error.message || "Terjadi kesalahan");
            }
        }
    }
);


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(firebaseUser){

    const url =
        SCRIPT_URL +
        "?action=getUser" +
        "&uid=" +
        encodeURIComponent(firebaseUser.uid) +
        "&email=" +
        encodeURIComponent(firebaseUser.email || "") +
        "&nama=" +
        encodeURIComponent(
            firebaseUser.displayName || "User"
        );

    const response = await fetch(url);

    if(!response.ok){
        throw new Error(
            "Server mengembalikan HTTP " +
            response.status
        );
    }

    const result = await response.json();

    if(!result.success){
        throw new Error(
            result.message ||
            "Gagal mengambil data user"
        );
    }

    currentUserData = result;

    const welcomeName =
        document.getElementById("welcomeName");

    if(welcomeName){
        welcomeName.innerText =
            "Selamat Datang, " +
            (
                result.nama ||
                firebaseUser.displayName ||
                "User"
            );
    }

    const welcomeEmail =
        document.getElementById("welcomeEmail");

    if(welcomeEmail){
        welcomeEmail.innerText =
            result.email ||
            firebaseUser.email ||
            "";
    }

    const roleBadge =
        document.getElementById("roleBadge");

    const role =
        String(result.role || "user")
            .trim()
            .toLowerCase();

    if(roleBadge){
        roleBadge.innerText = role.toUpperCase();
    }

    /*
     * ADMIN
     */
    if(role === "admin"){
        showAdminDashboard();
        await loadAdminDashboard();
        return;
    }

    /*
     * USER
     *
     * Jangan menggunakan window.location.href di sini.
     * User dashboard ditampilkan pada halaman yang sama
     * agar tidak terjadi reload / redirect loop.
     */
    showUserDashboard();
    await loadUserDashboard();
}


/* =====================================================
   SHOW USER
===================================================== */

function showUserDashboard(){

    const adminDashboard =
        document.getElementById("adminDashboard");

    const userDashboard =
        document.getElementById("userDashboard");

    if(adminDashboard){
        adminDashboard.classList.remove("active");
    }

    if(userDashboard){
        userDashboard.classList.add("active");
    }

    return true;
}


/* =====================================================
   LOAD USER DASHBOARD
===================================================== */

async function loadUserDashboard(){

    if(
        !currentUserData ||
        !currentUserData.uid
    ){
        return;
    }

    const url =
        SCRIPT_URL +
        "?action=userDashboard" +
        "&uid=" +
        encodeURIComponent(
            currentUserData.uid
        );

    try{

        const response =
            await fetch(url);

        const result =
            await response.json();

        if(!result.success){

            throw new Error(
                result.message ||
                "Gagal memuat dashboard"
            );

        }

        userDashboardData =
            result.data || [];


        populateUserBulanFilter();


        if(!userSelectedBulan){

            userSelectedBulan =
                getCurrentBulanTahun();

        }


        const select =
            document.getElementById(
                "userFilterBulan"
            );


        const tersedia =
            Array.from(
                select.options
            ).some(
                function(option){

                    return (
                        option.value ===
                        userSelectedBulan
                    );

                }
            );


        /*
           Jika bulan berjalan belum ada
           di dropdown, tetap gunakan bulan berjalan.
           Dashboard akan menampilkan nilai 0.
        */

        if(!tersedia){

            select.value = "";

        }
        else{

            select.value =
                userSelectedBulan;

        }


        applyUserFilter();

    }
    catch(error){

        console.error(error);

        alert(
            "Gagal memuat dashboard user:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   GET BULAN BERJALAN
===================================================== */

function getCurrentBulanTahun(){

    const bulanNama = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
    ];

    const sekarang =
        new Date();

    return (
        bulanNama[
            sekarang.getMonth()
        ] +
        " " +
        sekarang.getFullYear()
    );

}


/* =====================================================
   POPULATE FILTER BULAN USER
===================================================== */

function populateUserBulanFilter(){

    const select =
        document.getElementById(
            "userFilterBulan"
        );


    select.innerHTML =
        `
        <option value="">
            Semua Bulan
        </option>
        `;


    const bulanOrder = {

        Januari:1,
        Februari:2,
        Maret:3,
        April:4,
        Mei:5,
        Juni:6,
        Juli:7,
        Agustus:8,
        September:9,
        Oktober:10,
        November:11,
        Desember:12

    };


    const daftarBulan =
        [
            ...new Set(

                userDashboardData
                    .map(
                        function(row){

                            return (
                                row.bulanTahun ||
                                ""
                            );

                        }
                    )
                    .filter(Boolean)

            )
        ];


    daftarBulan
        .sort(
            function(a,b){

                const pa =
                    String(a).split(" ");

                const pb =
                    String(b).split(" ");

                const ya =
                    Number(pa[1]) || 0;

                const yb =
                    Number(pb[1]) || 0;


                if(ya !== yb){

                    return yb - ya;

                }


                return (
                    (bulanOrder[pb[0]] || 0)
                    -
                    (bulanOrder[pa[0]] || 0)
                );

            }
        )
        .forEach(
            function(item){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    item;

                option.textContent =
                    item;

                select.appendChild(
                    option
                );

            }
        );

}


/* =====================================================
   APPLY USER FILTER
===================================================== */

function applyUserFilter(){

    const bulan =
        userSelectedBulan;


    let filtered =
        userDashboardData.slice();


    if(bulan){

        filtered =
            filtered.filter(
                function(row){

                    return (
                        String(
                            row.bulanTahun || ""
                        ) ===
                        String(bulan)
                    );

                }
            );

    }


    let totalOmset = 0;

    let totalKulakan = 0;

    let totalTambahan = 0;


    filtered.forEach(
        function(row){

            totalOmset +=
                Number(row.omset) || 0;

            totalKulakan +=
                Number(row.kulakan) || 0;

            totalTambahan +=
                Number(
                    row.pendapatanTambahan
                ) || 0;

        }
    );


    document.getElementById(
        "uTotalOmset"
    ).innerText =
        rupiah(totalOmset);


    document.getElementById(
        "uTotalKulakan"
    ).innerText =
        rupiah(totalKulakan);


    const totalBersih = totalOmset * 0.10;

    const totalSisaOmset = totalOmset - totalBersih - totalKulakan;

    document.getElementById(
        "uTotalBersih"
    ).innerText =
        rupiah(totalBersih);


    document.getElementById(
        "uTotalTambahan"
    ).innerText =
        rupiah(totalTambahan);


    const info =
        document.getElementById(
            "userFilterInfo"
        );


    if(bulan){

        info.innerHTML =
            `
            <b>Menampilkan Dashboard:</b>
            ${escapeHTML(bulan)}
            &nbsp; | &nbsp;
            <b>${filtered.length}</b>
            laporan
            `;

    }
    else{

        info.innerHTML =
            `
            <b>Menampilkan:</b>
            Semua Bulan
            &nbsp; | &nbsp;
            <b>${filtered.length}</b>
            laporan
            `;

    }


    renderUserTable(filtered);

}


/* =====================================================
   RENDER USER TABLE
===================================================== */

function renderUserTable(rows){

    const body =
        document.getElementById(
            "userTableBody"
        );


    body.innerHTML = "";


    if(
        !rows ||
        rows.length === 0
    ){

        body.innerHTML =
            `
            <tr>

                <td
                    colspan="7"
                    class="empty">

                    Belum ada laporan pada periode ini.

                </td>

            </tr>
            `;

        return;

    }


    rows
        .slice()
        .reverse()
        .forEach(
            function(row){

                body.innerHTML +=
                `
                <tr>

                    <td>
                        ${escapeHTML(
                            formatTanggal(
                                row.waktu
                            )
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            row.bulanTahun || ""
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            row.kecamatan || ""
                        )}
                    </td>

                    <td>
                        ${rupiah(
                            row.omset
                        )}
                    </td>

                    <td>
                        ${rupiah(
                            row.kulakan
                        )}
                    </td>

                    <td>
                        ${rupiah(
                            (Number(row.omset) || 0) * 0.10
                        )}
                    </td>

                    <td>
                        ${rupiah(
                            row.pendapatanTambahan
                        )}
                    </td>

                </tr>
                `;

            }
        );

}


/* =====================================================
   HITUNG BERSIH
   Pendapatan Bersih = 10% dari Omset
   Sisa Omset = Omset - Pendapatan Bersih - Kulakan
===================================================== */

function hitungBersih(){

    const omset = Number(document.getElementById("omset").value) || 0;
    const kulakan = Number(document.getElementById("kulakan").value) || 0;
    const bersih = omset * 0.10;
    const sisa = omset - bersih - kulakan;

    document.getElementById("pendapatanBersih").value = rupiah(bersih);
    document.getElementById("sisaOmset").value = rupiah(sisa);
}

document.getElementById("omset").addEventListener("input", hitungBersih);
document.getElementById("kulakan").addEventListener("input", hitungBersih);
hitungBersih();


/* =====================================================
   SAVE DATA
===================================================== */

document.getElementById(
    "saveBtn"
).addEventListener(
    "click",
    saveData
);


async function saveData(){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "Silakan login terlebih dahulu."
        );

        return;

    }


    const nama =
        document.getElementById(
            "namaMustahik"
        ).value.trim();

    const kecamatan =
        document.getElementById(
            "kecamatan"
        ).value.trim();

    const bulan =
        document.getElementById(
            "bulan"
        ).value;

    const tahun =
        document.getElementById(
            "tahun"
        ).value;

    const omset =
        Number(
            document.getElementById(
                "omset"
            ).value
        ) || 0;

    const kulakan =
        Number(
            document.getElementById(
                "kulakan"
            ).value
        ) || 0;

    const tambahan =
        Number(
            document.getElementById(
                "pendapatanTambahan"
            ).value
        ) || 0;


    if(!nama){

        alert(
            "Nama Mustahik wajib diisi."
        );

        return;

    }

    if(!kecamatan){

        alert(
            "Kecamatan wajib diisi."
        );

        return;

    }

    if(!bulan){

        alert(
            "Silakan pilih bulan."
        );

        return;

    }

    if(!tahun){

        alert(
            "Silakan pilih tahun."
        );

        return;

    }


    const bulanTahun =
        bulan + " " + tahun;

    const bersih =
        omset * 0.10;

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );

    const status =
        document.getElementById(
            "saveStatus"
        );


    try{

        saveBtn.disabled = true;

        saveBtn.innerText =
            "⏳ Menyimpan...";

        status.className =
            "status loading";

        status.innerText =
            "Sedang menyimpan data...";


        const token =
            await user.getIdToken();


        const payload = {

            idToken:token,

            uid:user.uid,

            email:user.email,

            namaMustahik:nama,

            bulanTahun:bulanTahun,

            kecamatan:kecamatan,

            omset:omset,

            kulakan:kulakan,

            pendapatanBersih:bersih,

            pendapatanTambahan:tambahan

        };


        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",
                    body:
                        new URLSearchParams(
                            payload
                        )
                }
            );


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message
            );

        }


        status.className =
            "status success";

        status.innerText =
            "✅ " +
            result.message;


        document.getElementById(
            "bulan"
        ).value = "";

        document.getElementById(
            "tahun"
        ).value = "";

        document.getElementById(
            "omset"
        ).value = "";

        document.getElementById(
            "kulakan"
        ).value = "";

        document.getElementById(
            "pendapatanTambahan"
        ).value = "";

        document.getElementById(
            "pendapatanBersih"
        ).value =
            "Rp 0";


        await loadUserDashboard();

    }
    catch(error){

        console.error(error);

        status.className =
            "status error";

        status.innerText =
            "❌ Gagal menyimpan";

        alert(
            "Gagal menyimpan data:\n\n" +
            error.message
        );

    }
    finally{

        saveBtn.disabled = false;

        saveBtn.innerText =
            "💾 Simpan Laporan";

    }

}


/* =====================================================
   LOAD ADMIN
===================================================== */

async function loadAdminDashboard(){

    if(
        !currentUserData ||
        !currentUserData.uid
    ){
        return;
    }

    try{

        const url =
            SCRIPT_URL +
            "?action=adminDashboard" +
            "&uid=" +
            encodeURIComponent(
                currentUserData.uid
            );


        const response =
            await fetch(url);

        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message
            );

        }


        adminData =
            result.data || [];

        adminUsers =
            result.users || [];


        document.getElementById(
            "aTotalUser"
        ).innerText =
            result.summary.totalUser;


        document.getElementById(
            "aTotalLaporan"
        ).innerText =
            result.summary.totalLaporan;


        document.getElementById(
            "aTotalOmset"
        ).innerText =
            rupiah(
                result.summary.totalOmset
            );


        document.getElementById(
            "aTotalBersih"
        ).innerText =
            rupiah(
                (Number(result.summary.totalOmset) || 0) * 0.10
            );


        populateUserFilter();

        populateKecamatanFilter(
            result.filters
                ? result.filters.kecamatan
                : []
        );

        populateBulanFilter(
            result.filters
                ? result.filters.bulanTahun
                : []
        );

        renderAdminUsers();

        applyAdminFilter();

    }
    catch(error){

        console.error(error);

        alert(
            "Gagal memuat dashboard admin:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   USER FILTER
===================================================== */

function populateUserFilter(){

    const select =
        document.getElementById(
            "filterUser"
        );

    const oldValue =
        select.value;


    select.innerHTML =
        `
        <option value="">
            Semua User
        </option>
        `;


    adminUsers
        .filter(function(user){

            return (
                String(user.role || "user")
                    .toLowerCase()
                !== "admin"
            );

        })
        .sort(function(a,b){

            return String(a.nama || "")
                .localeCompare(
                    String(b.nama || ""),
                    "id"
                );

        })
        .forEach(function(user){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                user.uid;

            option.textContent =
                user.nama ||
                user.email ||
                user.uid;

            select.appendChild(option);

        });


    if(
        Array.from(
            select.options
        ).some(function(option){

            return option.value === oldValue;

        })
    ){

        select.value =
            oldValue;

    }

}


/* =====================================================
   KECAMATAN FILTER
===================================================== */

function populateKecamatanFilter(
    kecamatanList
){

    const select =
        document.getElementById(
            "filterKecamatan"
        );

    const oldValue =
        select.value;


    select.innerHTML =
        `
        <option value="">
            Semua Kecamatan
        </option>
        `;


    [...new Set(kecamatanList || [])]
        .filter(Boolean)
        .sort(function(a,b){

            return String(a)
                .localeCompare(
                    String(b),
                    "id"
                );

        })
        .forEach(function(kec){

            const option =
                document.createElement(
                    "option"
                );

            option.value = kec;

            option.textContent = kec;

            select.appendChild(option);

        });


    if(
        Array.from(
            select.options
        ).some(function(option){

            return option.value === oldValue;

        })
    ){

        select.value =
            oldValue;

    }

}

/* =====================================================
   UPDATE BULAN SESUAI USER
=====================================================

   Jika user dipilih,
   daftar bulan akan mengikuti
   bulan yang benar-benar dimiliki
   user tersebut.

===================================================== */

function updateBulanFilterByUser(){

    const uid =
        document.getElementById(
            "filterUser"
        ).value;


    const select =
        document.getElementById(
            "filterBulan"
        );


    const oldValue =
        select.value;


    let sourceData =
        adminData;


    if(uid){

        sourceData =
            adminData.filter(
                function(row){

                    return row.uid === uid;

                }
            );

    }


    const bulanSet = {};


    sourceData.forEach(
        function(row){

            if(row.bulanTahun){

                bulanSet[
                    row.bulanTahun
                ] = true;

            }

        }
    );


    populateBulanFilter(
        Object.keys(bulanSet)
    );


    if(
        Object.keys(bulanSet)
            .includes(oldValue)
    ){

        select.value =
            oldValue;

    }
    else{

        select.value = "";

    }

}


/* =====================================================
   APPLY FILTER ADMIN
===================================================== */

function applyAdminFilter(){

    const uid =
        document.getElementById(
            "filterUser"
        ).value;


    const kecamatan =
        document.getElementById(
            "filterKecamatan"
        ).value;


    const bulan =
        document.getElementById(
            "filterBulan"
        ).value;


    const search =
        document.getElementById(
            "filterSearch"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        adminData.filter(
            function(row){

                if(
                    uid &&
                    String(row.uid) !==
                    String(uid)
                ){

                    return false;

                }


                if(
                    kecamatan &&
                    String(row.kecamatan) !==
                    String(kecamatan)
                ){

                    return false;

                }


                if(
                    bulan &&
                    String(row.bulanTahun) !==
                    String(bulan)
                ){

                    return false;

                }


                if(search){

                    const text =
                        (
                            row.namaMustahik +
                            " " +
                            row.email +
                            " " +
                            row.kecamatan
                        )
                        .toLowerCase();


                    if(
                        !text.includes(search)
                    ){

                        return false;

                    }

                }


                return true;

            }
        );


    /* =================================================
       RENDER TABEL
    ================================================= */

    renderAdminTable(filtered);


    /* =================================================
       HITUNG SUMMARY FILTER
    ================================================= */

    let omset = 0;
    let kulakan = 0;
    let tambahan = 0;


    filtered.forEach(

                    row.pendapatanTambahan

        }
    );

        "fOmset"
    ).innerText =
        rupiah(omset);


    document.getElementById(
        "fKulakan"
    ).innerText =
        rupiah(kulakan);

    const sisaOmset = omset - bersih - kulakan;

        "fBersih"

        "fSisaOmset"

    ================================================= */

        );

            userSelect.selectedIndex
        ]
        ? userSelect.options[
            userSelect.selectedIndex
        ].text
        : "Semua User";


    const kecText =
        kecamatan ||
        "Semua Kecamatan";


    const bulanText =
        bulan ||
        "Semua Bulan";


    document.getElementById(
        "filterInfo"
    ).innerHTML =
        `
        <b>Filter aktif:</b>
        ${escapeHTML(userText)}
        &nbsp; | &nbsp;
        ${escapeHTML(kecText)}
        &nbsp; | &nbsp;
        ${escapeHTML(bulanText)}
        &nbsp; | &nbsp;
        <b>${filtered.length}</b> data
        `;


    /* =================================================
       CHART
    ================================================= */

    renderChart(filtered);

}

/* =====================================================
   RENDER CHART
===================================================== */

function renderChart(rows){

    const grouped = {};


    rows.forEach(
        function(row){

            const key =
                row.bulanTahun ||
                "Tidak diketahui";


            if(!grouped[key]){

                grouped[key] = {

                    omset:0,

                    kulakan:0,

                    bersih:0,
                    sisaOmset:0,

                    tambahan:0

                };

            }


            grouped[key].omset +=
                Number(row.omset) || 0;


            grouped[key].kulakan +=
                Number(row.kulakan) || 0;


            grouped[key].bersih +=
                Number(
                    row.pendapatanBersih
                ) || 0;


            grouped[key].tambahan +=
                Number(
                    row.pendapatanTambahan
                ) || 0;

        }
    );


    const bulanOrder = {

        Januari:1,
        Februari:2,
        Maret:3,
        April:4,
        Mei:5,
        Juni:6,
        Juli:7,
        Agustus:8,
        September:9,
        Oktober:10,
        November:11,
        Desember:12

    };


    const labels =
        Object.keys(grouped)
        .sort(function(a,b){

            const pa =
                String(a).split(" ");

            const pb =
                String(b).split(" ");

            const ya =
                Number(pa[1]) || 0;

            const yb =
                Number(pb[1]) || 0;


            if(ya !== yb){

                return ya - yb;

            }


            return (
                (bulanOrder[pa[0]] || 0)
                -
                (bulanOrder[pb[0]] || 0)
            );

        });


    const omset =
        labels.map(
            key =>
                grouped[key].omset
        );


    const kulakan =
        labels.map(
            key =>
                grouped[key].kulakan
        );


    const bersih =
        labels.map(
            key =>
                grouped[key].omset * 0.10
        );

    const sisaOmset =
        labels.map(
            key =>
                grouped[key].omset -
                (grouped[key].omset * 0.10) -
                grouped[key].kulakan
        );


    const tambahan =
        labels.map(
            key =>
                grouped[key].tambahan
        );


    /* =================================================
       JUDUL GRAFIK SESUAI USER
    ================================================= */

    const userSelect =
        document.getElementById(
            "filterUser"
        );


    const selectedUserText =
        userSelect.options[
            userSelect.selectedIndex
        ]
        ? userSelect.options[
            userSelect.selectedIndex
        ].text
        : "Semua User";


    const kecamatan =
        document.getElementById(
            "filterKecamatan"
        ).value;


    const bulan =
        document.getElementById(
            "filterBulan"
        ).value;


    let title =
        "📊 Grafik Keuangan";


    if(
        userSelect.value
    ){

        title +=
            " - " +
            selectedUserText;

    }
    else{

        title +=
            " - Semua User";

    }


    if(kecamatan){

        title +=
            " | " +
            kecamatan;

    }


    if(bulan){

        title +=
            " | " +
            bulan;

    }


    document.getElementById(
        "chartTitle"
    ).innerText =
        title;


    /* =================================================
       DESTROY CHART
    ================================================= */

    if(financeChart){

        financeChart.destroy();

        financeChart = null;

    }


    const ctx =
        document.getElementById(
            "financeChart"
        );


    financeChart =
        new Chart(
            ctx,
            {

                type:"bar",

                data:{

                    labels:labels,

                    datasets:[

                        {
                            label:"Omset",
                            data:omset,
                            borderWidth:1
                        },

                        {
                            label:"Kulakan",
                            data:kulakan,
                            borderWidth:1
                        },

                        {
                            label:"Pendapatan Bersih (10% Omset)",
                            data:bersih,
                            borderWidth:1
                        },

                        {
                            label:"Sisa Omset",
                            data:sisaOmset,
                            borderWidth:1
                        },

                        {
                            label:"Pendapatan Tambahan",
                            data:tambahan,
                            borderWidth:1
                        }

                    ]

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{
                        mode:"index",
                        intersect:false
                    },

                    scales:{

                        y:{

                            beginAtZero:true,

                            ticks:{

                                callback:
                                    function(value){

                                        return rupiah(
                                            value
                                        );

                                    }

                            }

                        }

                    },

                    plugins:{

                        legend:{
                            position:"top"
                        },

                        tooltip:{

                            callbacks:{

                                label:
                                    function(context){

                                        return (
                                            context.dataset.label +
                                            ": " +
                                            rupiah(
                                                context.raw
                                            )
                                        );

                                    }

                            }

                        }

                    }

                }

            }
        );

}

document.getElementById(
    "userResetFilter"
).addEventListener(
    "click",
    function(){

        userSelectedBulan =
            getCurrentBulanTahun();


        const select =
            document.getElementById(
                "userFilterBulan"
            );


        const tersedia =
            Array.from(
                select.options
            ).some(
                function(option){

                    return (
                        option.value ===
                        userSelectedBulan
                    );

                }
            );


        if(tersedia){

            select.value =
                userSelectedBulan;

        }
        else{

            select.value = "";

        }


        applyUserFilter();

    }
);

function renderUserChart(rows){
    const grouped={};
    rows.forEach(function(row){const key=row.bulanTahun||"Tidak diketahui"; if(!grouped[key]) grouped[key]={omset:0,kulakan:0,tambahan:0}; grouped[key].omset+=Number(row.omset)||0; grouped[key].kulakan+=Number(row.kulakan)||0; grouped[key].tambahan+=Number(row.pendapatanTambahan)||0;});
    const order={Januari:1,Februari:2,Maret:3,April:4,Mei:5,Juni:6,Juli:7,Agustus:8,September:9,Oktober:10,November:11,Desember:12};
    const labels=Object.keys(grouped).sort(function(a,b){const pa=a.split(" "),pb=b.split(" "),ya=Number(pa[1])||0,yb=Number(pb[1])||0;return ya!==yb?ya-yb:(order[pa[0]]||0)-(order[pb[0]]||0);});

      {label:"Pendapatan Tambahan",data:d("tambahan",x=>x.tambahan)}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+rupiah(c.raw)}}}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return rupiah(v)}}}}}});
}
